// ---- Coran en un seul bloc continu (toutes pages, toutes sourates, comme un Mushaf réel) ----
let fullQuranPagesCache = null;
async function loadFullQuranPages(){
  if(fullQuranPagesCache) return fullQuranPagesCache;
  const cached = await getCachedQuran('quran-full-pages-v2');
  if(cached){ fullQuranPagesCache = cached; return cached; }
  const res = await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');
  const data = await res.json();
  const pages = [];
  let current = null;
  data.data.surahs.forEach(surah => {
    surah.ayahs.forEach((a, idx) => {
      const pageNum = a.page || 1;
      if(!current || current.page !== pageNum){
        current = { page: pageNum, juz: a.juz, items: [] };
        pages.push(current);
      }
      const item = { a: { number: a.number, numberInSurah: a.numberInSurah, text: a.text, surah: surah.number } };
      if(idx === 0) item.surahName = surah.name;
      current.items.push(item);
    });
  });
  fullQuranPagesCache = pages;
  await setCachedQuran('quran-full-pages-v2', pages);
  return pages;
}
// ---- Index du Coran entier (verset global -> sourate / page) ----
const QURAN_TOTAL_AYAHS = 6236;
let qfoAyahMap = {};
let qfoSurahAyahs = {};
function buildQfoIndex(pages){
  qfoAyahMap = {}; qfoSurahAyahs = {};
  pages.forEach((pg, pi) => pg.items.forEach(({a}) => {
    qfoAyahMap[a.number] = { surah: a.surah, n: a.numberInSurah, pageIdx: pi, page: pg.page, text: a.text };
    (qfoSurahAyahs[a.surah] = qfoSurahAyahs[a.surah] || []).push(a.number);
  }));
}
// Traduction complète (une seule requête pour tout le Coran, puis en cache)
let fullTrArr = null;
let fullTrLang = null;
async function loadFullTranslation(){
  if(fullTrArr && fullTrLang === lang) return fullTrArr;
  const key = `quran-full-tr-${lang}-v1`;
  let arr = await getCachedQuran(key);
  if(!arr){
    const edition = lang === 'fr' ? 'fr.hamidullah' : await resolveTrEdition();
    const res = await fetch(`https://api.alquran.cloud/v1/quran/${edition}`);
    const data = await res.json();
    arr = [];
    data.data.surahs.forEach(sr => sr.ayahs.forEach(a => { arr[a.number] = a.text; }));
    await setCachedQuran(key, arr);
  }
  fullTrArr = arr; fullTrLang = lang;
  return arr;
}
async function saveQfoLastPage(p){
  try{ await window.storage.set('quran-full-last-page', String(p), false); }catch(e){}
}
async function getQfoLastPage(){
  try{ const r = await window.storage.get('quran-full-last-page', false); return r ? parseInt(r.value, 10) : 0; }
  catch(e){ return 0; }
}

async function openFullQuranContinuous(targetPage){
  const t = UI[lang];
  isFullQuranContinuous = true;
  const overlay = document.getElementById('quranFullscreenOverlay');
  overlay.classList.add('open');
  document.getElementById('qfoContent').innerHTML = `<p class="sub" style="padding:20px;color:#fff;">${t.quranLoading}</p>`;
  const pages = await loadFullQuranPages();
  quranFullscreenState.pages = pages;
  buildQfoIndex(pages);
  // Sans page demandée, on reprend là où tu t'étais arrêté la dernière fois.
  const startPage = targetPage || await getQfoLastPage();
  quranFullscreenState.index = startPage
    ? Math.max(0, pages.findIndex(pg => pg.page === startPage))
    : 0;
  applyQuranFontChoice(await getQuranFontChoice());
  quranReciter = await getQuranReciter();
  if(showTranslation){
    try{ await loadFullTranslation(); }catch(e){ showTranslation = false; }
  }
  document.getElementById('qfoAudioBar').classList.add('show');
  fillQfoBarReciter();
  refreshQfoPlayLabels();

  document.getElementById('qfoCloseBtn').textContent = t.quranFullscreenExit;
  document.getElementById('qfoVerticalBtn').textContent = t.quranFullscreenVertical;
  document.getElementById('qfoHorizontalBtn').textContent = t.quranFullscreenHorizontal;
  try{
    if(overlay.requestFullscreen) overlay.requestFullscreen().catch(()=>{});
  }catch(e){}
  // Vue continue = à la manière d'un vrai livre arabe : pages qui se tournent
  // de droite à gauche, pas un défilement vertical.
  setFullscreenOrientation('horizontal');
  if(targetPage && quranFullscreenState.orientation === 'vertical'){
    setTimeout(()=>{
      const pageEl = document.querySelector(`.qfo-content .mushaf-page[data-page-num="${targetPage}"]`);
      if(pageEl) pageEl.scrollIntoView({behavior:'auto', block:'start'});
    }, 150);
  }
}

// ---- Mode plein écran (lecture immersive, vertical ou horizontal) ----
const quranFullscreenState = { pages: [], index: 0, orientation: 'vertical' };

function openMushafFullscreen(s){
  const t = UI[lang];
  isFullQuranContinuous = false;
  document.getElementById('qfoAudioBar').classList.add('show');
  fillQfoBarReciter();
  refreshQfoPlayLabels();
  quranFullscreenState.pages = computeMushafPages(s);
  quranFullscreenState.index = 0;

  const overlay = document.getElementById('quranFullscreenOverlay');
  document.getElementById('qfoCloseBtn').textContent = t.quranFullscreenExit;
  document.getElementById('qfoVerticalBtn').textContent = t.quranFullscreenVertical;
  document.getElementById('qfoHorizontalBtn').textContent = t.quranFullscreenHorizontal;

  overlay.classList.add('open');
  try{
    if(overlay.requestFullscreen) overlay.requestFullscreen().catch(()=>{});
  }catch(e){}

  setFullscreenOrientation('vertical');
}

function closeMushafFullscreen(){
  if(isFullQuranContinuous){
    try{
      const pg = quranFullscreenState.pages[qfoCurrentPageIndex()];
      if(pg) saveQfoLastPage(pg.page);
    }catch(e){}
    stopQuranAudio();
  }
  const overlay = document.getElementById('quranFullscreenOverlay');
  overlay.classList.remove('open');
  try{
    if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }catch(e){}
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }catch(e){}
}

let isFullQuranContinuous = false;
function setFullscreenOrientation(orientation){
  const t = UI[lang];
  quranFullscreenState.orientation = orientation;
  document.getElementById('qfoVerticalBtn').classList.toggle('active', orientation === 'vertical');
  document.getElementById('qfoHorizontalBtn').classList.toggle('active', orientation === 'horizontal');
  document.getElementById('qfoNav').style.display = orientation === 'horizontal' ? 'flex' : 'none';
  renderFullscreenContent();
  // En mode horizontal, on tente de basculer le téléphone en paysage automatiquement
  // (comme dans un jeu mobile). Certains navigateurs refusent — dans ce cas
  // l'utilisateur peut simplement tourner son téléphone lui-même.
  try{
    if(orientation === 'horizontal' && screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }else if(orientation === 'vertical' && screen.orientation && screen.orientation.unlock){
      screen.orientation.unlock();
    }
  }catch(e){}
}

// ---- Rendu vertical par petits blocs (pour éviter de charger les 604 pages d'un
// coup, qui faisait planter l'affichage) : on affiche une fenêtre de pages autour
// de la position actuelle, et on en charge davantage automatiquement au défilement.
const QFO_CHUNK_SIZE = 8;
let qfoVerticalStart = 0;
let qfoVerticalEnd = 0;
let qfoBottomObserver = null;

function renderVerticalChunked(){
  const t = UI[lang];
  const content = document.getElementById('qfoContent');
  const pages = quranFullscreenState.pages;
  const center = quranFullscreenState.index || 0;
  qfoVerticalStart = Math.max(0, center - Math.floor(QFO_CHUNK_SIZE / 2));
  qfoVerticalEnd = Math.min(pages.length, qfoVerticalStart + QFO_CHUNK_SIZE);

  content.innerHTML = `
    ${qfoVerticalStart > 0 ? `<button class="qfo-load-more" id="qfoLoadPrevBtn">${t.quranFullscreenLoadPrev}</button>` : ''}
    <div id="qfoVerticalPages">${pages.slice(qfoVerticalStart, qfoVerticalEnd).map(pg => renderMushafPageHTML(pg, t)).join('')}</div>
    <div id="qfoBottomSentinel"></div>
  `;
  bindMushafAyahControls(content);

  const loadPrevBtn = document.getElementById('qfoLoadPrevBtn');
  if(loadPrevBtn){
    loadPrevBtn.addEventListener('click', ()=>{
      const addCount = Math.min(QFO_CHUNK_SIZE, qfoVerticalStart);
      const newStart = qfoVerticalStart - addCount;
      const extraHtml = pages.slice(newStart, qfoVerticalStart).map(pg => renderMushafPageHTML(pg, t)).join('');
      const wrap = document.getElementById('qfoVerticalPages');
      const prevHeight = content.scrollHeight;
      wrap.insertAdjacentHTML('afterbegin', extraHtml);
      qfoVerticalStart = newStart;
      bindMushafAyahControls(content);
      // On garde la même position visuelle après avoir ajouté du contenu au-dessus.
      content.scrollTop += (content.scrollHeight - prevHeight);
      if(qfoVerticalStart === 0 && loadPrevBtn) loadPrevBtn.remove();
    });
  }

  if(qfoBottomObserver) qfoBottomObserver.disconnect();
  const sentinel = document.getElementById('qfoBottomSentinel');
  if(sentinel && qfoVerticalEnd < pages.length){
    qfoBottomObserver = new IntersectionObserver((entries)=>{
      if(entries[0].isIntersecting){
        const addCount = Math.min(QFO_CHUNK_SIZE, pages.length - qfoVerticalEnd);
        if(addCount <= 0) return;
        const extraHtml = pages.slice(qfoVerticalEnd, qfoVerticalEnd + addCount).map(pg => renderMushafPageHTML(pg, t)).join('');
        document.getElementById('qfoVerticalPages').insertAdjacentHTML('beforeend', extraHtml);
        qfoVerticalEnd += addCount;
        bindMushafAyahControls(content);
        if(qfoVerticalEnd >= pages.length && qfoBottomObserver){ qfoBottomObserver.disconnect(); }
      }
    }, { root: content, rootMargin: '400px' });
    qfoBottomObserver.observe(sentinel);
  }
}

function renderFullscreenContent(){
  const t = UI[lang];
  const content = document.getElementById('qfoContent');
  const pages = quranFullscreenState.pages;

  if(quranFullscreenState.orientation === 'vertical'){
    content.classList.remove('qfo-horizontal');
    renderVerticalChunked();
  }else{
    content.classList.add('qfo-horizontal');
    if(qfoBottomObserver){ qfoBottomObserver.disconnect(); qfoBottomObserver = null; }
    const pg = pages[quranFullscreenState.index];
    content.innerHTML = pg ? renderMushafPageHTML(pg, t) : '';
    document.getElementById('qfoPageIndicator').textContent =
      `${quranFullscreenState.index + 1} ${t.quranFullscreenPageOf} ${pages.length}`;
    document.getElementById('qfoPrevBtn').disabled = quranFullscreenState.index <= 0;
    document.getElementById('qfoNextBtn').disabled = quranFullscreenState.index >= pages.length - 1;
    bindMushafAyahControls(content);
    if(isFullQuranContinuous && pg) saveQfoLastPage(pg.page);
  }
}

async function goToQfoPage(pageNum){
  if(!isFullQuranContinuous){
    // On vient d'une sourate précise en plein écran : bascule vers la vue
    // continue pour pouvoir atteindre n'importe quelle page.
    await openFullQuranContinuous(pageNum);
    return;
  }
  const idx = quranFullscreenState.pages.findIndex(pg => pg.page === pageNum);
  if(idx >= 0){
    quranFullscreenState.index = idx;
    if(quranFullscreenState.orientation !== 'horizontal') setFullscreenOrientation('horizontal');
    else renderFullscreenContent();
  }
  document.getElementById('qfoMenuPanel').style.display = 'none';
}

// Coran en entier — mêmes options que la vue sourate :
// récitateur, écoute (page / sourate), barre de progression, répétition,
// traduction, mode test, police, saut vers un verset, recherche, notes.

let qfoTestOn = false;
let qfoRepeatSession = 0;
let qfoNormTexts = null;

function qfoFormatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  return `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
}
function qfoCurrentPageIndex(){
  const st = quranFullscreenState;
  if(st.orientation === 'horizontal') return st.index;
  const content = document.getElementById('qfoContent');
  const top = content.getBoundingClientRect().top;
  for(const el of content.querySelectorAll('.mushaf-page')){
    if(el.getBoundingClientRect().bottom > top + 40){
      const i = st.pages.findIndex(p => p.page === parseInt(el.dataset.pageNum, 10));
      if(i >= 0) return i;
    }
  }
  return st.index || 0;
}
// Appelé à chaque verset lu : tourne la page (ou charge la suite en vertical)
function qfoPageIdxOf(g){
  const m=qfoAyahMap[g];
  if(isFullQuranContinuous && m) return m.pageIdx;
  return quranFullscreenState.pages.findIndex(pg=>pg.items.some(it=>it.a.number===g));
}
function fillQfoBarReciter(){
  const sel=document.getElementById('qfoBarReciter'); if(!sel) return;
  sel.innerHTML=QURAN_RECITERS.map(r=>`<option value="${r.id}" ${r.id===quranReciter?'selected':''}>${r.name}</option>`).join('');
}
document.getElementById('qfoBarReciter').addEventListener('change',async e=>{
  quranReciter=e.target.value; stopQuranAudio(); await setQuranReciter(quranReciter); refreshQfoPlayLabels();
});
function qfoOnAyahStart(g){
  const meta = {pageIdx: qfoPageIdxOf(g)};
  if(meta.pageIdx < 0) return;
  const st = quranFullscreenState;
  if(st.orientation === 'horizontal'){
    if(st.index !== meta.pageIdx){ st.index = meta.pageIdx; renderFullscreenContent(); }
  }else{
    const wrap = document.getElementById('qfoVerticalPages');
    if(wrap && meta.pageIdx >= qfoVerticalEnd){
      const html = st.pages.slice(qfoVerticalEnd, meta.pageIdx + 1).map(pg => renderMushafPageHTML(pg, UI[lang])).join('');
      wrap.insertAdjacentHTML('beforeend', html);
      qfoVerticalEnd = meta.pageIdx + 1;
      bindMushafAyahControls(wrap);
    }
  }
}
function playQfoFromCurrentPage(){
  const pg = quranFullscreenState.pages[qfoCurrentPageIndex()];
  if(!pg) return;
  const queue = [];
  quranFullscreenState.pages.slice(qfoCurrentPageIndex()).forEach(p => p.items.forEach(it => queue.push(it.a.number)));
  playAyahsGapless(queue, true);
}
function qfoGoToAyah(g){
  const meta = qfoAyahMap[g];
  if(!meta) return;
  goToQfoPage(meta.page);
  setTimeout(()=>{
    const el = document.querySelector(`.qfo-content .mushaf-ayah[data-global-num="${g}"]`);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.remove('jump-highlight');
    void el.offsetWidth;
    el.classList.add('jump-highlight');
  }, 200);
}
function refreshQfoPlayLabels(){
  const t = UI[lang];
  const b = document.getElementById('qfoPlayBtn');
  if(b) b.textContent = quranAudioState.playing ? '⏸' : '▶';
  const s = document.getElementById('qfoMenuPlaySurahBtn');
  if(s) s.textContent = quranAudioState.playing ? t.quranPauseSurah : t.quranPlaySurah;
}
// Barre de lecture (toujours visible en bas) : lecture + progression
(function(){
  const a = getQuranAudioEl();
  let dragging = false;
  ['play','pause','emptied','ended'].forEach(ev => a.addEventListener(ev, refreshQfoPlayLabels));
  a.addEventListener('loadedmetadata', ()=>{
    const bar = document.getElementById('qfoSeekBar');
    if(!bar) return;
    bar.max = Math.floor(a.duration) || 100;
    document.getElementById('qfoSeekTotal').textContent = qfoFormatTime(a.duration);
  });
  a.addEventListener('timeupdate', ()=>{
    const bar = document.getElementById('qfoSeekBar');
    if(!bar || dragging) return;
    bar.value = Math.floor(a.currentTime);
    document.getElementById('qfoSeekCurrent').textContent = qfoFormatTime(a.currentTime);
  });
  a.addEventListener('emptied', ()=>{
    const bar = document.getElementById('qfoSeekBar');
    if(!bar) return;
    bar.value = 0;
    document.getElementById('qfoSeekCurrent').textContent = '0:00';
    document.getElementById('qfoSeekTotal').textContent = '0:00';
  });
  const bar = document.getElementById('qfoSeekBar');
  bar.addEventListener('input', ()=>{ dragging = true; });
  bar.addEventListener('change', ()=>{ a.currentTime = parseInt(bar.value, 10); dragging = false; });
  document.getElementById('qfoPlayBtn').addEventListener('click', ()=>{
    if(quranAudioState.playing) stopQuranAudio();
    else playQfoFromCurrentPage();
    refreshQfoPlayLabels();
  });
  // Mode test : toucher un verset le révèle / le recache
  document.getElementById('qfoContent').addEventListener('click', (e)=>{
    if(!document.getElementById('qfoContent').classList.contains('qfo-test-on')) return;
    if(e.target.closest('.ayah-play-btn, .ayah-record-btn')) return;
    const row = e.target.closest('.mushaf-ayah-row');
    if(row) row.classList.toggle('revealed');
  });
})();

function qfoNormalizeArabic(s){
  return s.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
          .replace(/[\u0671\u0622\u0623\u0625]/g, '\u0627');
}

async function buildQfoExtraSections(panel){
  const t = UI[lang];
  const st = quranFullscreenState;
  const pg = st.pages[qfoCurrentPageIndex()];
  const curSurah = pg ? (pg.items[0].a.surah || 1) : 1;
  quranReciter = await getQuranReciter();
  const fontChoice = await getQuranFontChoice();
  const note = await getSurahNote(curSurah);

  // Valeurs par défaut du bloc "répéter" : versets de la sourate visibles sur cette page
  const onPage = pg ? pg.items.filter(it => it.a.surah === curSurah).map(it => it.a.numberInSurah) : [];
  const repFrom = onPage.length ? Math.min(...onPage) : '';
  const repTo = onPage.length ? Math.max(...onPage) : '';

  const surahOptions = sel => Array.from({length: 114}, (_, i) => i + 1)
    .map(n => `<option value="${n}" ${n === sel ? 'selected' : ''}>${n}. ${localSurahName(n)}</option>`).join('');

  panel.insertAdjacentHTML('beforeend', `
    <div class="qfo-menu-section">

      </select>
      <div class="qfo-menu-btnrow">
        <button id="qfoMenuPlayPageBtn">${t.quranFullPlayFromPage}</button>
        <button id="qfoMenuPlaySurahBtn">${t.quranPlaySurah}</button>
      </div>
    </div>

    <div class="qfo-menu-section">
      <p class="qfo-menu-section-title">${t.quranRepeatToggle}</p>
      <select class="qfo-menu-select" id="qfoRepSurah">${surahOptions(curSurah)}</select>
      <div class="qfo-menu-row qfo-gap">
        <input type="number" id="qfoRepFrom" min="1" value="${repFrom}" placeholder="${t.quranRepeatFrom}">
        <input type="number" id="qfoRepTo" min="1" value="${repTo}" placeholder="${t.quranRepeatTo}">
        <input type="number" id="qfoRepCount" min="1" max="50" value="5" placeholder="${t.quranRepeatCount}">
      </div>
      <div class="qfo-menu-btnrow"><button id="qfoRepStartBtn">${t.quranRepeatStart}</button></div>
      <p class="quran-repeat-status" id="qfoRepStatus" style="text-align:left;"></p>
    </div>

    <div class="qfo-menu-section">
      <p class="qfo-menu-section-title">${t.quranFullJumpTitle}</p>
      <select class="qfo-menu-select" id="qfoJumpSurah">${surahOptions(curSurah)}</select>
      <div class="qfo-menu-row qfo-gap">
        <input type="number" id="qfoJumpAyah" min="1" placeholder="${t.quranAyahJumpPlaceholder}">
        <button id="qfoJumpGoBtn">${t.quranTOCGo}</button>
      </div>
    </div>

    <div class="qfo-menu-section">
      <p class="qfo-menu-section-title">${t.quranFullDisplayTitle}</p>
      <label style="font-size:12.5px;color:var(--ink-soft);">${t.quranFontFamilyLabel}</label>
      <select class="qfo-menu-select" id="qfoFontSelect" style="margin-top:6px;">
        ${QURAN_FONTS.map(f => `<option value="${f.id}" ${f.id === fontChoice ? 'selected' : ''}>${f.name}</option>`).join('')}
      </select>
      <label class="surah-toggle"><input type="checkbox" id="qfoTransToggle" ${showTranslation ? 'checked' : ''}> ${t.quranShowTrans}</label>
      <label class="surah-toggle"><input type="checkbox" id="qfoTajToggle" ${qTaj ? 'checked' : ''}> 🎨 ${LL('Tajwid en couleurs','Renkli tecvid')}</label>
      <div>
        <button class="quran-test-toggle${qfoTestOn ? ' active' : ''}" id="qfoTestBtn" style="margin-top:0;">${t.quranTestMode}</button>
        <p class="quran-test-hint" id="qfoTestHint" style="display:${qfoTestOn ? 'block' : 'none'};">${t.quranTestHint}</p>
      </div>
    </div>

    <div class="qfo-menu-section">
      <p class="qfo-menu-section-title">${t.quranFullSearchTitle}</p>
      <input type="text" class="qfo-menu-select" id="qfoSearchInput" placeholder="${t.quranFullSearchPlaceholder}" dir="rtl">
      <div class="qfo-menu-surah-list" id="qfoSearchResults" style="display:none;"></div>
    </div>

    <div class="qfo-menu-section">
      <p class="qfo-menu-section-title">${t.quranNoteLabel} — ${localSurahName(curSurah)}</p>
      <textarea class="qfo-menu-select" id="qfoNoteInput" rows="3" placeholder="${t.quranNotePlaceholder}">${note}</textarea>
      <p class="quran-note-saved" id="qfoNoteSaved">${t.quranNoteSaved} ✓</p>

  refreshQfoPlayLabels();

  // Récitateur
  document.getElementById('qfoReciterSelect').addEventListener('change', async (e)=>{
    quranReciter = e.target.value;
    await setQuranReciter(quranReciter);
    stopQuranAudio(); // évite de mélanger deux récitateurs
  });
  // Écoute
  document.getElementById('qfoMenuPlayPageBtn').addEventListener('click', ()=>{
    playQfoFromCurrentPage();
    panel.style.display = 'none';
  });
  document.getElementById('qfoMenuPlaySurahBtn').addEventListener('click', ()=>{
    if(quranAudioState.playing){ stopQuranAudio(); }
    else{ playFullSurahAudio(curSurah, qfoSurahAyahs[curSurah] || []); }
    refreshQfoPlayLabels();
  });

  // Répéter un passage
  document.getElementById('qfoRepStartBtn').addEventListener('click', ()=>{
    const statusEl = document.getElementById('qfoRepStatus');
    const sNum = parseInt(document.getElementById('qfoRepSurah').value, 10);
    const list = qfoSurahAyahs[sNum] || [];
    const from = parseInt(document.getElementById('qfoRepFrom').value, 10);
    const to = parseInt(document.getElementById('qfoRepTo').value, 10);
    const count = Math.max(1, parseInt(document.getElementById('qfoRepCount').value, 10) || 1);
    if(!from || !to || from < 1 || to > list.length || from > to){
      statusEl.textContent = t.quranRepeatInvalid;
      return;
    }
    const range = list.slice(from - 1, to);
    const fullQueue = [];
    for(let i = 0; i < count; i++) fullQueue.push(...range);
    qfoRepeatSession++;
    const mine = qfoRepeatSession;
    playAyahsGapless(fullQueue, true);
    const track = ()=>{
      if(mine !== qfoRepeatSession || !quranAudioState.playing) return;
      const rep = Math.min(count, Math.floor(quranAudioState.index / range.length) + 1);
      statusEl.textContent = `${t.quranRepeatStatus} ${rep} ${t.quranRepeatOf} ${count}`;
      setTimeout(track, 400);
    };
    track();
    panel.style.display = 'none';
  });

  // Aller à un verset
  const doJump = ()=>{
    const sNum = parseInt(document.getElementById('qfoJumpSurah').value, 10);
    const n = parseInt(document.getElementById('qfoJumpAyah').value, 10) || 1;
    const g = (qfoSurahAyahs[sNum] || [])[n - 1];
    if(g) qfoGoToAyah(g);
  };
  document.getElementById('qfoJumpGoBtn').addEventListener('click', doJump);
  document.getElementById('qfoJumpAyah').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doJump(); });

  // Police
  document.getElementById('qfoFontSelect').addEventListener('change', async (e)=>{

    applyQuranFontChoice(e.target.value);
  });
  // Traduction
  document.getElementById('qfoTransToggle').addEventListener('change', async (e)=>{
    showTranslation = e.target.checked;
    if(showTranslation){
      try{ await loadFullTranslation(); }
      catch(err){ showTranslation = false; e.target.checked = false; alert(t.quranFullTrError); return; }
    }
    st.index = qfoCurrentPageIndex();
    renderFullscreenContent();
  });
  document.getElementById('qfoTajToggle').addEventListener('change',async e=>{
    qTaj=e.target.checked;
    if(qTaj){ try{ await loadTajweed(); }catch(err){ qTaj=false; e.target.checked=false; alert(LL('Tajwid indisponible — vérifie ta connexion.','Tecvid kullanılamıyor — bağlantını kontrol et.')); return; } }
    st.index=qfoCurrentPageIndex(); renderFullscreenContent(); });
  // Mode test
  document.getElementById('qfoTestBtn').addEventListener('click', (e)=>{
    qfoTestOn = !qfoTestOn;
    e.currentTarget.classList.toggle('active', qfoTestOn);
    document.getElementById('qfoTestHint').style.display = qfoTestOn ? 'block' : 'none';
    const content = document.getElementById('qfoContent');
    content.classList.toggle('qfo-test-on', qfoTestOn);
    content.querySelectorAll('.mushaf-ayah-row.revealed').forEach(r => r.classList.remove('revealed'));
  });

  // Recherche d'un mot dans tout le Coran
  let searchTimer = null;
  document.getElementById('qfoSearchInput').addEventListener('input', (e)=>{
    clearTimeout(searchTimer);
    const q = qfoNormalizeArabic(e.target.value.trim());
    searchTimer = setTimeout(()=>{
      const box = document.getElementById('qfoSearchResults');
      if(!q){ box.style.display = 'none'; box.innerHTML = ''; return; }
      if(!qfoNormTexts){
        qfoNormTexts = {};
        for(const g in qfoAyahMap) qfoNormTexts[g] = qfoNormalizeArabic(qfoAyahMap[g].text);
      }
      const hits = [];
      for(let g = 1; g <= QURAN_TOTAL_AYAHS && hits.length < 50; g++){
        if(qfoNormTexts[g] && qfoNormTexts[g].includes(q)) hits.push(g);
      }
      box.style.display = 'block';
      if(!hits.length){ box.innerHTML = `<div class="qfo-menu-surah-row">${t.quranFullSearchNoResult}</div>`; return; }
      box.innerHTML = hits.map(g => `
        <div class="qfo-menu-surah-row qfo-search-row" data-g="${g}">
          <span>${localSurahName(qfoAyahMap[g].surah)} — ${qfoAyahMap[g].n}</span>
          <span class="qfo-search-ar">${qfoAyahMap[g].text}</span>
        </div>`).join('');
      box.querySelectorAll('.qfo-search-row').forEach(row=>{
        row.addEventListener('click', ()=> qfoGoToAyah(parseInt(row.dataset.g, 10)));
      });
    }, 300);
  });

  // Notes sur la sourate de la page en cours
  let noteTimer = null;
  document.getElementById('qfoNoteInput').addEventListener('input', (e)=>{
    clearTimeout(noteTimer);
    noteTimer = setTimeout(async ()=>{
      await setSurahNote(curSurah, e.target.value);
      const saved = document.getElementById('qfoNoteSaved');
      saved.classList.add('show');
      setTimeout(()=> saved.classList.remove('show'), 1500);
    }, 500);
  });
}

});
document.getElementById('qfoNextBtn').addEventListener('click', ()=>{
  if(quranFullscreenState.index < quranFullscreenState.pages.length - 1){
    quranFullscreenState.index++;
    renderFullscreenContent();
  }
});
// Balayage tactile (swipe) pour naviguer entre les pages en mode horizontal.
(function(){
  let touchStartX = null;
  const content = document.getElementById('qfoContent');
  content.addEventListener('touchstart', (e)=>{
    if(quranFullscreenState.orientation !== 'horizontal' || e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
  });
  content.addEventListener('touchend', (e)=>{
    if(quranFullscreenState.orientation !== 'horizontal' || touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if(Math.abs(dx) < 50) return;
    // Lecture RTL : glisser vers la gauche (comme tourner une page d'un livre arabe)
    // = page précédente ; vers la droite = page suivante.
    if(dx < 0) document.getElementById('qfoPrevBtn').click();
    else document.getElementById('qfoNextBtn').click();
  });
})();

// Pincer pour zoomer (pinch-to-zoom) + boutons zoom, en plein écran.
const quranFullscreenZoom = { level: 1 };
function applyFullscreenZoom(){
  quranFullscreenZoom.level = Math.max(0.7, Math.min(2.2, quranFullscreenZoom.level));
  document.getElementById('qfoContent').style.setProperty('--qfo-zoom', quranFullscreenZoom.level);
}
function zoomFullscreen(delta){
  quranFullscreenZoom.level += delta;
  applyFullscreenZoom();
}
(function(){
  let pinchStartDist = null;
  let pinchStartZoom = 1;
  const content = document.getElementById('qfoContent');
  function dist(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  content.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){
      pinchStartDist = dist(e.touches);
      pinchStartZoom = quranFullscreenZoom.level;
    }
  });
  content.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2 && pinchStartDist){
      e.preventDefault();
      const newDist = dist(e.touches);
      quranFullscreenZoom.level = pinchStartZoom * (newDist / pinchStartDist);
      applyFullscreenZoom();
    }
  }, {passive:false});
  content.addEventListener('touchend', (e)=>{
    if(e.touches.length < 2) pinchStartDist = null;
  });
})();
document.getElementById('qfoZoomInBtn').addEventListener('click', ()=> zoomFullscreen(0.15));
document.getElementById('qfoZoomOutBtn').addEventListener('click', ()=> zoomFullscreen(-0.15));

function renderAyahListHTML(s, transAyahs, t){
  if(quranViewMode === 'page'){
    // Regroupe les versets par page du Mushaf (donnée fournie par l'API), pour un
    // rendu en texte continu façon "page de Coran" plutôt qu'une carte par verset.
    const pages = computeMushafPages(s);
    const pagesHtml = pages.map(pg => renderMushafPageHTML(pg, t)).join('');
    return `<div id="ayahList" style="font-size:${quranFontSize}px;">${pagesHtml}</div>`;
  }

  // Vue défilement (par défaut) : une carte par verset, avec un séparateur de Cüz
  // à chaque changement (utile pour se repérer comme dans le Coran physique).
  let lastJuz = null;
  const itemsHtml = s.ayahs.map((a, i) => {
    let divider = '';
    if(a.juz && a.juz !== lastJuz){
      divider = `<div class="quran-juz-divider">— ${t.quranJuzLabel} ${a.juz} —</div>`;
      lastJuz = a.juz;
    }
    return `
      ${divider}
      <div class="ayah-item" data-ayah-index="${i}" data-global-num="${a.number}">
        <div class="ayah-item-top">
          <button class="ayah-play-btn" data-play-global="${a.number}" title="${t.quranPlayAyah}">▶</button>
          <button class="ayah-record-btn" data-record-global="${a.number}" title="${t.quranRecordAyah}">🎙️</button>
          <button class="ayah-bm-btn${bmSet.has(a.number)?' on':''}" data-bm="${a.number}" title="Signet">🔖</button>
          <button class="ayah-tafsir-btn" data-tafsir="${a.number}" title="Tafsir">📚</button>
          <div class="ayah-num">${a.numberInSurah}</div>
        </div>
        <div class="ayah-ar">${a.text}</div>
        ${transAyahs ? `<div class="ayah-tr">${transAyahs[i].text}</div>` : ''}
        <div class="ayah-recording-box" data-recording-box="${a.number}"></div>
        <div class="ayah-tafsir-box"></div>
      </div>
    `;
  }).join('');
  return `<div class="ayah-list" id="ayahList" style="font-size:${quranFontSize}px;">${itemsHtml}</div>`;
}

async function searchQuranText(query){
  const q = query.trim();
  if(!q) return [];
  const offlineSet = await getOfflineSurahSet();
  const results = [];
  for(const num of offlineSet){
    const s = await getCachedQuran('quran-uthmani-' + num);
    if(!s || !s.ayahs) continue;
    s.ayahs.forEach(a => {
      if(a.text.includes(q)){
        results.push({ num, ayahNum: a.numberInSurah, text: a.text, surahName: s.name });
      }
    });
  }
  return results;
}

      await setFontSizePref(quranFontSize);
      document.getElementById('ayahList').style.fontSize = quranFontSize + 'px';
    });

    function jumpToAyah(numberInSurah){
      const target = s.ayahs.find(a => a.numberInSurah === numberInSurah);
      if(!target) return;
      const el = document.querySelector(`.ayah-item[data-global-num="${target.number}"]`);
      if(!el) return;

      el.classList.remove('jump-highlight');

    document.getElementById('quranAyahJumpInput').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        const n = parseInt(e.target.value, 10);
        if(n) jumpToAyah(n);
      }
    });
    if(targetGlobalAyah){
      // Petit délai pour laisser le DOM (et la police) se stabiliser avant de
      // calculer la position de défilement.
      setTimeout(()=>{
        const el = document.querySelector(`.ayah-item[data-global-num="${targetGlobalAyah}"]`);
        if(el){
          el.scrollIntoView({behavior:'smooth', block:'center'});
          el.classList.remove('jump-highlight');
          void el.offsetWidth;
          el.classList.add('jump-highlight');
        }
      }, 200);
    }

    // ---- Mode test ----
    const ayahListEl = document.getElementById('ayahList');
    const testToggleBtn = document.getElementById('quranTestToggleBtn');
    const testHint = document.getElementById('quranTestHint');
    let testModeOn = false;
    testToggleBtn.addEventListener('click', ()=>{
      testModeOn = !testModeOn;
      testToggleBtn.classList.toggle('active', testModeOn);
      testHint.style.display = testModeOn ? 'block' : 'none';
      ayahListEl.querySelectorAll('.ayah-item').forEach(el=> el.classList.toggle('test-hidden', testModeOn));
    });

    // Mémorise le verset qui vient d'être lu, pour que "Reprendre" depuis
    // l'accueil ramène pile au bon endroit (pas juste au début de la sourate).
    let lastVisibleAyahGlobal = null;
    const ayahObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry => {
        if(entry.isIntersecting){
          const g = parseInt(entry.target.dataset.globalNum, 10);
          if(g) lastVisibleAyahGlobal = g;
        }
      });
    }, { root: null, threshold: 0.5 });
    ayahListEl.querySelectorAll('.ayah-item').forEach(el => ayahObserver.observe(el));
    let saveAyahTimer = null;
    document.addEventListener('scroll', ()=>{
      clearTimeout(saveAyahTimer);
      saveAyahTimer = setTimeout(()=>{
        if(lastVisibleAyahGlobal) setLastReadAyah(lastVisibleAyahGlobal);
      }, 600);
    }, { passive: true });

    ayahListEl.addEventListener('click', (e)=>{
      if(!testModeOn) return;
      if(e.target.closest('.ayah-play-btn')) return;
      const item = e.target.closest('.ayah-item');
      if(item) item.classList.toggle('test-hidden');
    });

    let noteTimer = null;
    document.getElementById('quranNoteInput').addEventListener('input', (e)=>{
      clearTimeout(noteTimer);
      noteTimer = setTimeout(async ()=>{
        await setSurahNote(num, e.target.value);
        const saved = document.getElementById('quranNoteSaved');
        saved.classList.add('show');
        setTimeout(()=> saved.classList.remove('show'), 1500);
      }, 500);
    });

    // ---- Audio ----
    document.getElementById('quranFontFamilySelect').addEventListener('change', async (e)=>{
      quranFontChoice = e.target.value;
      await setQuranFontChoice(quranFontChoice);
      applyQuranFontChoice(quranFontChoice);
    });
    document.getElementById('quranReciterSelect').addEventListener('change', async (e)=>{
      quranReciter = e.target.value;
      await setQuranReciter(quranReciter);
      // Si une lecture est en cours, on l'arrête pour éviter de mélanger deux récitateurs.
      stopQuranAudio();
    });
    document.getElementById('playSurahBtn').addEventListener('click', ()=>{
      if(quranAudioState.playing){ stopQuranAudio(); }
      else{ playFullSurahAudio(num, s.ayahs.map(a => a.number)); }
    });

    // ---- Barre de progression (avance/recule dans l'écoute) ----
    function formatTime(sec){
      if(!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s2 = Math.floor(sec % 60);
      return `${m}:${String(s2).padStart(2, '0')}`;
    }
    const seekBox = document.getElementById('quranSeekBox');
    const seekBar = document.getElementById('quranSeekBar');
    const seekCurrent = document.getElementById('qseekCurrent');
    const seekTotal = document.getElementById('qseekTotal');
    const audioEl = getQuranAudioEl();
    let seekDragging = false;
    audioEl.onloadedmetadata = ()=>{
      seekBar.max = Math.floor(audioEl.duration) || 100;
      seekTotal.textContent = formatTime(audioEl.duration);
      seekBox.style.display = 'flex';
    };
    audioEl.ontimeupdate = ()=>{
      if(seekDragging) return;
      seekBar.value = Math.floor(audioEl.currentTime);
      seekCurrent.textContent = formatTime(audioEl.currentTime);
      if(!quranAudioState.playing) seekBox.style.display = 'none';
    };
    seekBar.addEventListener('input', ()=>{ seekDragging = true; });
    seekBar.addEventListener('change', ()=>{
      audioEl.currentTime = parseInt(seekBar.value, 10);
      seekDragging = false;
    });

    // ---- Répéter un passage précis (pour la mémorisation) ----
    const repeatToggleBtn = document.getElementById('quranRepeatToggleBtn');
    const repeatPanel = document.getElementById('quranRepeatPanel');
    repeatToggleBtn.addEventListener('click', ()=>{
      repeatPanel.style.display = repeatPanel.style.display === 'none' ? 'block' : 'none';
    });
    let repeatSessionId = 0;
    document.getElementById('quranRepeatStartBtn').addEventListener('click', async ()=>{
      const statusEl = document.getElementById('quranRepeatStatus');
      const from = parseInt(document.getElementById('quranRepeatFrom').value, 10);
      const to = parseInt(document.getElementById('quranRepeatTo').value, 10);
      const count = Math.max(1, parseInt(document.getElementById('quranRepeatCount').value, 10) || 1);
      if(!from || !to || from < 1 || to > s.ayahs.length || from > to){
        statusEl.textContent = t.quranRepeatInvalid;
        return;
      }
      const range = s.ayahs.filter(a => a.numberInSurah >= from && a.numberInSurah <= to).map(a => a.number);
      const fullQueue = [];
      for(let i = 0; i < count; i++) fullQueue.push(...range);

      // Un identifiant de session : si on relance une répétition pendant qu'une
      // autre tourne déjà, l'ancienne boucle de suivi s'arrête proprement au lieu
      // de continuer à mettre à jour l'affichage en même temps que la nouvelle.
      repeatSessionId++;
      const mySessionId = repeatSessionId;
      // On réutilise le lecteur verset par verset, mais en suivant nous-mêmes la
      // progression pour afficher "Répétition X sur Y" (chaque répétition = 1 passage
      // dans le lot de versets choisi).
      playAyahsGapless(fullQueue, false);
      const trackProgress = ()=>{
        if(mySessionId !== repeatSessionId || !quranAudioState.playing) return;
        const doneAyahs = quranAudioState.index;
        const currentRep = Math.min(count, Math.floor(doneAyahs / range.length) + 1);
        statusEl.textContent = `${t.quranRepeatStatus} ${currentRep} ${t.quranRepeatOf} ${count}`;
        if(quranAudioState.playing) setTimeout(trackProgress, 400);
      };
      trackProgress();
    });
    ayahListEl.querySelectorAll('.ayah-play-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        playQuranSurah([parseInt(btn.dataset.playGlobal, 10)]);
      });
    });
    ayahListEl.querySelectorAll('.ayah-record-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const num = parseInt(btn.dataset.recordGlobal, 10);
        if(currentMediaRecorder && currentRecordingGlobalNum === num){
          stopAyahRecording();
        }else if(!currentMediaRecorder){
          startAyahRecording(num);
        }
      });
    });
    ayahListEl.querySelectorAll('.ayah-recording-box').forEach(box=>{
      const num = parseInt(box.dataset.recordingBox, 10);
      renderAyahRecordingBox(num, box);
    });

    const searchToggleBtn = document.getElementById('quranTextSearchToggleBtn');
    const searchBox = document.getElementById('quranTextSearchBox');
    searchToggleBtn.addEventListener('click', ()=>{
      searchBox.style.display = searchBox.style.display === 'none' ? 'block' : 'none';
    });
    let textSearchTimer = null;
    document.getElementById('quranTextSearchInput').addEventListener('input', (e)=>{
      clearTimeout(textSearchTimer);
      const q = e.target.value;
      textSearchTimer = setTimeout(async ()=>{
        const resultsEl = document.getElementById('quranTextSearchResults');
        if(!q.trim()){ resultsEl.innerHTML = ''; return; }
        const results = await searchQuranText(q);
        if(results.length === 0){
          resultsEl.innerHTML = `<p class="sub">${t.quranTextSearchNoResult}</p>`;
          return;
        }
        resultsEl.innerHTML = results.slice(0, 50).map(r => `
          <div class="quran-text-search-result" data-num="${r.num}">
            <div class="qtsr-title">${r.surahName} — ${r.ayahNum}</div>
            <div class="qtsr-ar">${r.text}</div>
          </div>
        `).join('');
        resultsEl.querySelectorAll('.quran-text-search-result').forEach(el=>{
          el.addEventListener('click', ()=> loadSurah(parseInt(el.dataset.num, 10)));
        });
      }, 400);
    });
  }catch(e){
    container.innerHTML = `
      <button class="quiz-next" id="backToList">${t.quranBack}</button>
      <p class="rec-error">${t.quranError}</p>
    `;
    document.getElementById('backToList').addEventListener('click', ()=>{ currentOpenSurah = null; renderSurahList(); });
  }
}

// ---- Enregistrement audio (comparaison de sa propre voix) ----
let mediaRecorder = null;
let recChunks = [];
let isRecording = false;

function renderRecorder(){
  const t = UI[lang];
  const controls = document.getElementById('recControls');
  controls.innerHTML = `<button class="record" id="recBtn">${isRecording ? t.recStop : t.recStart}</button>`;
  document.getElementById('recBtn').addEventListener('click', toggleRecording);
}

async function toggleRecording(){
  const t = UI[lang];
  if(isRecording){
    mediaRecorder.stop();
    isRecording = false;
    renderRecorder();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => recChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      document.getElementById('recPlayback').innerHTML = `<audio controls src="${url}"></audio>`;
      stream.getTracks().forEach(track => track.stop());
    };
    mediaRecorder.start();
    isRecording = true;
    renderRecorder();
  }catch(e){
    document.getElementById('recPlayback').innerHTML = `<div class="rec-error">${t.recDenied}</div>`;
  }
}

// ---- Streak, historique et badges ----
const STREAK_KEY = 'mahrec-streak-v1';
const HISTORY_KEY = 'mahrec-history-v1';
const STATS_KEY = 'mahrec-lifetime-stats-v1';
let streak = { current: 0, longest: 0, lastDate: null };
let history = [];
let lifetimeStats = { quizCorrect: 0, matchRounds: 0 };

function todayStr(){ return new Date().toISOString().slice(0, 10); }
function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

async function loadStreak(){
  try{
    const result = await window.storage.get(STREAK_KEY, false);
    if(result && result.value) streak = JSON.parse(result.value);
  }catch(e){ streak = { current:0, longest:0, lastDate:null }; }

  const today = todayStr();
  if(streak.lastDate !== today){
    const diff = streak.lastDate ? daysBetween(streak.lastDate, today) : null;
    if(diff === 1) streak.current += 1;
    else if(diff === null || diff > 1) streak.current = 1;
    // diff === 0 already excluded by the outer check
    streak.longest = Math.max(streak.longest || 0, streak.current);
    streak.lastDate = today;
    try{ await window.storage.set(STREAK_KEY, JSON.stringify(streak), false); }catch(e){}
  }
}

async function loadHistory(){
  try{
    const result = await window.storage.get(HISTORY_KEY, false);
    if(result && result.value) history = JSON.parse(result.value);
  }catch(e){ history = []; }
}

async function recordTodaySnapshot(){
  const total = Object.values(LETTERS).flat().filter((_, i) => true).length;
  let doneCount = 0;
  Object.values(state).forEach(e => { if(e && e.done) doneCount++; });
  const today = todayStr();
  const last = history[history.length - 1];
  if(last && last.date === today){
    last.count = doneCount;
  } else {
    history.push({ date: today, count: doneCount });
  }
  if(history.length > 60) history = history.slice(-60);
  try{ await window.storage.set(HISTORY_KEY, JSON.stringify(history), false); }catch(e){}
}

async function loadLifetimeStats(){
  try{
    const result = await window.storage.get(STATS_KEY, false);
    if(result && result.value) lifetimeStats = JSON.parse(result.value);
  }catch(e){ lifetimeStats = { quizCorrect:0, matchRounds:0 }; }
}
async function persistLifetimeStats(){
  try{ await window.storage.set(STATS_KEY, JSON.stringify(lifetimeStats), false); }catch(e){}
}

function renderStreakRow(){
  const t = UI[lang];
  document.getElementById('streakRow').innerHTML = `
    <div class="streak-card"><div class="streak-num">${streak.current || 0}</div><div class="streak-label">${t.streakCurrent} (${t.streakDays})</div></div>
    <div class="streak-card"><div class="streak-num">${streak.longest || 0}</div><div class="streak-label">${t.streakBest} (${t.streakDays})</div></div>
  `;
}

function renderChart(){
  const t = UI[lang];
  const last14 = history.slice(-14);
  const max = 28;
  document.getElementById('chartBox').innerHTML = `
    <div class="chart-title">${t.chartTitle}</div>
    <div class="chart-bars">
      ${last14.map(h => {
        const pct = Math.max(2, Math.round((h.count / max) * 100));
        const d = new Date(h.date);
        const label = `${d.getDate()}/${d.getMonth()+1}`;
        return `<div class="chart-bar-wrap"><div class="chart-bar" style="height:${pct}%;"></div><div class="chart-day">${label}</div></div>`;
      }).join('')}
    </div>
  `;
}

function totalLettersDone(){
  let n = 0;
  Object.values(state).forEach(e => { if(e && e.done) n++; });
  return n;
}

function renderBadges(){
  const t = UI[lang];
  const doneCount = totalLettersDone();
  const BADGES = [
    { emoji:'🌱', name:t.badge5, unlocked: doneCount >= 5 },
    { emoji:'🌿', name:t.badge15, unlocked: doneCount >= 15 },
    { emoji:'🌳', name:t.badge28, unlocked: doneCount >= 28 },
    { emoji:'🔥', name:t.badgeStreak3, unlocked: (streak.longest || 0) >= 3 },
    { emoji:'⚡', name:t.badgeStreak7, unlocked: (streak.longest || 0) >= 7 },
    { emoji:'🏆', name:t.badgeStreak30, unlocked: (streak.longest || 0) >= 30 },
    { emoji:'📝', name:t.badgeJournal1, unlocked: journal.length >= 1 },
    { emoji:'📚', name:t.badgeJournal10, unlocked: journal.length >= 10 },
    { emoji:'🎯', name:t.badgeQuiz10, unlocked: (lifetimeStats.quizCorrect || 0) >= 10 },
    { emoji:'🧩', name:t.badgeMatch1, unlocked: (lifetimeStats.matchRounds || 0) >= 1 },
  ];
  document.getElementById('badgesGrid').innerHTML = BADGES.map(b => `
    <div class="badge-item${b.unlocked ? ' unlocked' : ''}">
      <div class="badge-emoji">${b.emoji}</div>
      <div class="badge-name">${b.name}</div>
    </div>
  `).join('');
}

async function renderStatsPage(){
  renderStreakRow();
  renderChart();
  renderBadges();
}

// ---- Journal ----
const JOURNAL_KEY = 'mahrec-journal-v1';
let journal = [];

function renderJournal(){
  const t = UI[lang];
  const list = document.getElementById('journalList');
  if(journal.length === 0){
    list.innerHTML = `<div class="journal-empty">${t.journalEmpty}</div>`;

  }
  list.innerHTML = journal.map(e => `
    <div class="journal-item"><span class="jd">${e.date}</span><span class="jt">${e.text}</span></div>

}

async function persistJournal(){
  try{ await window.storage.set(JOURNAL_KEY, JSON.stringify(journal), false); }
  catch(e){ console.error('Journal save failed', e); }
}
async function loadJournal(){
  try{
    const result = await window.storage.get(JOURNAL_KEY, false);
    if(result && result.value) journal = JSON.parse(result.value);
  }catch(e){ journal = []; }
  renderJournal();
}

document.getElementById('journalDate').valueAsDate = new Date();
document.getElementById('journalAddBtn').addEventListener('click', ()=>{

  const inputEl = document.getElementById('journalInput');

// ---- Export / Import ----
async function collectQuranUserData(){
  const data = {};
  try{
    const result = await window.storage.list('quran-', false);
    const keys = (result && result.keys) || [];
    for(const k of keys){
      // On n'exporte que les données créées par l'utilisateur, pas le texte du Coran
      // lui-même (favoris, notes, statuts, compteurs, dernière lecture, taille de police) —
      // ça évite un fichier de sauvegarde énorme, et ce texte est re-téléchargeable.
      if(k.startsWith('quran-uthmani-') || k.startsWith('quran-tr-') || k === 'quran-surah-list') continue;
      const r = await window.storage.get(k, false).catch(()=>null);
      if(r) data[k] = r.value;
    }
  }catch(e){}
  return data;
}

document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const quran = await collectQuranUserData();
  const data = { progression: state, journal: journal, quran: quran, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mahrec-donnees.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFileInput').click();
});

document.getElementById('importFileInput').addEventListener('change', (e)=>{
  const t = UI[lang];
  const statusEl = document.getElementById('importStatus');
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.progression){
        state = data.progression;
        await persist();
      }
      if(data.journal){
        journal = data.journal;
        await persistJournal();
      }
      if(data.quran){
        for(const [k, v] of Object.entries(data.quran)){
          await window.storage.set(k, v, false);
        }
      }
      statusEl.textContent = t.importSuccess;
      statusEl.style.display = 'block';
      statusEl.style.color = 'var(--emerald)';
      renderLetters();
      renderJournal();
      if(document.querySelector('.page[data-page="quran"]').classList.contains('active')){
        surahList = null;
        loadSurahList();
      }
    }catch(err){
      statusEl.textContent = t.importError;
      statusEl.style.display = 'block';
      statusEl.style.color = 'var(--risk)';
    }
    setTimeout(()=>{ statusEl.style.display = 'none'; }, 4000);
    e.target.value = '';
  };
  reader.readAsText(file);
});
