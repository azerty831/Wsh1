<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kur'an-ı Kerim</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1D4A35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kur'an-ı Kerim">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Amiri:wght@400;700&family=Lateef&family=Scheherazade+New&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC; --paper-2:#F2EBD9; --ink:#20291F; --ink-soft:#5B6459;
    --emerald:#2E6B4E; --emerald-deep:#1D4A35; --gold:#B0812B; --gold-soft:#E4CB93;
    --line:#DCD2B4; --risk:#9C4A32; --risk-soft:#F3E1D8; --card:#FFFFFF;
  }
  body.dark{
    --paper:#1B211C; --paper-2:#222A22; --ink:#EDE8D8; --ink-soft:#A9B0A2;
    --emerald:#4C9970; --emerald-deep:#8BD1A6; --gold:#D9AA4E; --gold-soft:#6B5A30;
    --line:#39412F; --risk:#D98B6E; --risk-soft:#3A2A22; --card:#232B24;
  }
  body{transition:background .2s ease, color .2s ease;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3', sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:860px;margin:0 auto;padding:48px 20px 90px;}

  header{display:flex;gap:28px;align-items:center;margin-bottom:8px;}
  .hero-text{flex:1;min-width:220px;}
  .kicker-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .kicker{font-size:14px;color:var(--gold);letter-spacing:.02em;}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;flex-shrink:0;}
  .lang-btn{
    font-family:'Source Sans 3', sans-serif;font-size:13px;font-weight:600;padding:6px 14px;
    background:var(--card);color:var(--ink-soft);border:none;cursor:pointer;
  }
  .lang-btn.active{background:var(--emerald);color:#fff;}
  .dark-toggle{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  h1{font-family:'Fraunces', serif;font-size:clamp(32px,6vw,48px);font-weight:500;margin:0 0 10px;line-height:1.05;}
  .sub{color:var(--ink-soft);font-size:15.5px;max-width:52ch;line-height:1.55;}
  .diagram-hero{width:150px;height:150px;flex-shrink:0;}

  .app-nav{
    display:flex;gap:8px;overflow-x:auto;margin-top:26px;padding-bottom:10px;
    border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .app-nav::-webkit-scrollbar{display:none;}
  .app-nav button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:9px 16px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;flex-shrink:0;
  }
  .app-nav button.active{background:var(--emerald);border-color:var(--emerald);color:#fff;}

  .page{display:none;}
  .page.active{display:block;animation:pageFadeIn .28s ease;}
  @keyframes pageFadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* Effet de pression global : tout élément cliquable réagit légèrement au toucher. */
  button, [role="button"], .ayah-item, .surah-item, .quran-toc-row,
  .home-card, .letter-card, .surah-toggle, input[type="checkbox"] + label{
    transition:transform .12s ease;
  }
  button:active, [role="button"]:active, .ayah-item:active, .surah-item:active,
  .quran-toc-row:active, .home-card:active{
    transform:scale(0.96);
  }

  .progress-block{
    margin-top:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:16px 0;display:flex;align-items:center;gap:16px;
  }
  .progress-track{flex:1;height:8px;background:var(--paper-2);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;background:var(--emerald);width:0%;transition:width .4s ease;}
  .progress-label{font-size:14px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums;}

  .ref-links{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px;color:var(--ink-soft);}
  .ref-links a{color:var(--emerald-deep);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold-soft);}
  .ref-links a:hover{border-bottom-color:var(--emerald);}

  section.zone{margin-top:46px;}
  .zone-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px;}
  .zone-head h2{font-family:'Fraunces', serif;font-weight:500;font-size:22px;margin:0;}
  .zone-head .zone-ar{font-family:'Amiri', serif;color:var(--gold);font-size:22px;}
  .zone-count{margin-left:auto;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  .letters{display:flex;flex-direction:column;gap:10px;}
  .letter-card{border:1px solid var(--line);background:var(--card);border-radius:10px;overflow:hidden;transition:transform .12s ease;}
  .letter-card:active{transform:scale(0.98);}
  .letter-row{display:flex;align-items:center;gap:16px;padding:12px 16px;cursor:pointer;user-select:none;}
  .letter-ar-badge{font-family:'Amiri', serif;font-size:34px;line-height:1;width:48px;text-align:center;flex-shrink:0;color:var(--ink);}
  .letter-card.done .letter-ar-badge{color:var(--emerald-deep);}
  .letter-main{flex:1;min-width:0;}
  .letter-name{font-size:14.5px;font-weight:600;}
  .letter-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.35;}
  .check{
    width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:var(--card);
    transition:background .15s ease, border-color .15s ease;
  }
  .letter-card.done .check{background:var(--gold);border-color:var(--gold);animation:checkPop .3s ease;}
  @keyframes checkPop{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
  .letter-card.done .letter-name{color:var(--emerald-deep);}
  .caret{color:var(--ink-soft);font-size:12px;transition:transform .2s ease;flex-shrink:0;width:14px;text-align:center;}
  .letter-card.open .caret{transform:rotate(90deg);}

  .letter-detail{max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--paper-2);}
  .letter-card.open .letter-detail{max-height:640px;border-top:1px solid var(--line);}
  .letter-detail-inner{padding:20px 18px 22px;display:grid;grid-template-columns:150px 1fr;gap:20px;}
  .detail-visual{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .detail-visual svg{width:140px;height:140px;}
  .detail-big-ar{font-family:'Amiri', serif;font-size:48px;line-height:1;color:var(--emerald-deep);}
  .detail-zone-tag{font-size:11px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px;text-align:center;}
  .detail-img-link{font-size:12px;color:var(--emerald-deep);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold-soft);text-align:center;}
  .detail-img-link:hover{border-bottom-color:var(--emerald);}

  .detail-block{margin-bottom:12px;}
  .detail-block:last-child{margin-bottom:0;}
  .detail-block-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);font-weight:600;margin-bottom:3px;}
  .detail-block-text{font-size:13.5px;line-height:1.55;color:var(--ink);}
  .detail-block-text a{color:var(--emerald-deep);font-weight:600;}

  .letter-note-label{font-size:12px;color:var(--ink-soft);margin-bottom:4px;display:block;margin-top:14px;}
  .letter-note{
    width:100%;resize:vertical;min-height:44px;font-family:inherit;font-size:13.5px;
    padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);
  }
  .letter-note:focus{outline:none;border-color:var(--emerald);}

  @media (max-width:560px){
    .letter-detail-inner{grid-template-columns:1fr;}
    .detail-visual{flex-direction:row;justify-content:center;}
    header{flex-direction:column;align-items:flex-start;}
    .diagram-hero{order:-1;}
  }

  .tip{font-size:13.5px;color:var(--ink-soft);margin-top:14px;padding-left:14px;border-left:2px solid var(--gold);line-height:1.5;}

  .risk-section{margin-top:56px;}
  .risk-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:24px;margin:0 0 4px;}
  .risk-grid{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .risk-item{background:var(--risk-soft);border:1px solid #E3C3B2;border-radius:8px;padding:14px 16px;}
  .risk-pair{font-family:'Amiri', serif;font-size:24px;color:var(--risk);margin-bottom:4px;}
  .risk-desc{font-size:13.5px;color:var(--ink);line-height:1.5;}
  .risk-imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .risk-imgs a{font-size:12px;font-weight:600;color:var(--emerald-deep);text-decoration:none;border-bottom:1px solid var(--gold-soft);}

  .quiz-section, .sifat-section, .journal-section{margin-top:56px;}
  .quiz-section h2, .sifat-section h2, .journal-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:24px;margin:0 0 4px;}
  .quiz-box{
    margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:28px 20px;text-align:center;
  }
  .quiz-diff{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .quiz-diff button{
    font-family:'Source Sans 3', sans-serif;font-size:13px;font-weight:600;padding:7px 15px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;
  }
  .quiz-diff button.active.easy{background:#4C9970;border-color:#4C9970;color:#fff;}
  .quiz-diff button.active.medium{background:var(--gold);border-color:var(--gold);color:#fff;}
  .quiz-diff button.active.hard{background:var(--risk);border-color:var(--risk);color:#fff;}
  .quiz-score{margin-top:10px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .quiz-ar{font-family:'Amiri', serif;font-size:64px;color:var(--ink);margin-bottom:14px;}
  .quiz-display-text{font-family:'Fraunces', serif;font-size:19px;color:var(--emerald-deep);margin-bottom:14px;line-height:1.4;}
  .quiz-prompt{font-size:14px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;text-align:left;max-width:480px;margin-left:auto;margin-right:auto;}
  .quiz-opt{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:11px 16px;
    border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
    text-align:left;line-height:1.4;
  }
  .quiz-opt.correct{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .quiz-opt.wrong{background:var(--risk);border-color:var(--risk);color:#fff;}
  .quiz-feedback{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-top:10px;max-width:52ch;margin-left:auto;margin-right:auto;}
  .quiz-next{
    margin-top:16px;font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;
    padding:8px 18px;border-radius:20px;border:1px solid var(--emerald);background:transparent;color:var(--emerald-deep);cursor:pointer;
  }

  .quiz-modes{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}

  .flash-progress{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;font-variant-numeric:tabular-nums;}
  .flash-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    min-height:180px;display:flex;align-items:center;justify-content:center;
    padding:26px 20px;text-align:center;cursor:pointer;
  }
  .flash-front{font-family:'Amiri', serif;font-size:56px;color:var(--ink);}
  .flash-back{display:none;font-size:14.5px;line-height:1.6;color:var(--ink);}
  .flash-card.revealed .flash-front{display:none;}
  .flash-card.revealed .flash-back{display:block;}
  .flash-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;}
  .flash-btn{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:10px 20px;
    border-radius:20px;border:none;cursor:pointer;
  }
  .flash-btn.reveal{background:var(--emerald);color:#fff;}
  .flash-btn.know{background:var(--emerald);color:#fff;}
  .flash-btn.review{background:var(--risk);color:#fff;}

  .tf-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 20px;text-align:center;}
  .tf-statement{font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:18px;}
  .tf-options{display:flex;gap:10px;justify-content:center;margin-bottom:12px;}
  .tf-opt{
    font-family:'Source Sans 3', sans-serif;font-size:14px;font-weight:700;padding:10px 26px;
    border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .tf-opt.correct{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .tf-opt.wrong{background:var(--risk);border-color:var(--risk);color:#fff;}

  .match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .match-card{
    aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:'Amiri', serif;font-size:22px;color:var(--ink);padding:6px;text-align:center;line-height:1.2;
  }
  .match-card.selected{border-color:var(--emerald);background:var(--paper-2);}
  .match-card.matched{background:var(--emerald);border-color:var(--emerald);color:#fff;opacity:0.6;}
  @media (max-width:480px){ .match-grid{grid-template-columns:repeat(3,1fr);} }

  .sifat-grid{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .sifat-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
  .sifat-name{font-family:'Fraunces', serif;font-size:16px;color:var(--emerald-deep);margin-bottom:4px;}
  .sifat-desc{font-size:13.5px;color:var(--ink);line-height:1.5;}

  .rules-section{margin-top:56px;}
  .rules-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:24px;margin:0 0 4px;}
  .rule-category{margin-top:26px;}
  .rule-category-title{
    font-family:'Fraunces', serif;font-size:17px;color:var(--gold);margin-bottom:10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .rule-grid{display:flex;flex-direction:column;gap:8px;}
  .rule-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 15px;}
  .rule-name{font-size:14px;font-weight:600;color:var(--emerald-deep);margin-bottom:3px;}
  .rule-desc{font-size:13px;color:var(--ink);line-height:1.5;}

  .journal-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
  .journal-form input[type="date"]{
    font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:var(--card);color:var(--ink);
  }
  .journal-form input[type="text"]{
    flex:1;min-width:180px;font-family:inherit;font-size:13.5px;padding:8px 10px;
    border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);
  }
  .journal-form button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:8px 18px;
    border-radius:6px;border:none;background:var(--emerald);color:#fff;cursor:pointer;
  }
  .journal-list{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .journal-item{
    display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;font-size:13.5px;align-items:baseline;
  }
  .journal-item .jd{font-weight:600;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .journal-item .jt{color:var(--ink);flex:1;}
  .journal-empty{font-size:13.5px;color:var(--ink-soft);margin-top:14px;}

  .export-row{margin-top:44px;text-align:center;}
  .export-row button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:10px 22px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
    margin:0 6px 10px;
  }
  .export-row .tool-note{margin-top:8px;}

  .resources{margin-top:56px;}
  .resources h2{font-family:'Fraunces', serif;font-weight:500;font-size:26px;margin:0 0 4px;}
  .resources .sub{margin-bottom:20px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{
    font-family:'Source Sans 3', sans-serif;font-size:14px;font-weight:600;padding:8px 16px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;
  }
  .tab.active{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .res-group{display:none;flex-direction:column;gap:10px;}
  .res-group.active{display:flex;}
  .res-item{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);}
  .res-item:hover{border-color:var(--emerald);}
  .res-num{font-family:'Fraunces', serif;color:var(--gold);font-size:15px;flex-shrink:0;width:20px;}
  .res-title{font-size:15px;font-weight:600;margin-bottom:2px;line-height:1.3;}
  .res-note{font-size:13px;color:var(--ink-soft);line-height:1.4;}

  footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);}

  .progress-section h2, .tools-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:26px;margin:0 0 4px;}

  .streak-box{
    margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .streak-num{font-family:'Fraunces', serif;font-size:38px;color:var(--gold);line-height:1;}
  .streak-label{font-size:12.5px;color:var(--ink-soft);}
  .streak-sep{width:1px;height:34px;background:var(--line);}

  .badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:20px;}
  .badge-item{
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-align:center;
    opacity:0.4;
  }
  .badge-item.unlocked{opacity:1;border-color:var(--gold);}
  .badge-icon{font-size:26px;margin-bottom:6px;}
  .badge-name{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;}

  .graph-box{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;}
  .graph-title{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}

  .tool-block{margin-top:34px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 20px;}
  .tool-block h3{font-family:'Fraunces', serif;font-size:18px;font-weight:500;margin:0 0 12px;color:var(--emerald-deep);}
  .tool-note{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;}

  .metro-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .metro-controls select, .metro-controls button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:9px 14px;
    border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .metro-controls button.start{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .metro-display{text-align:center;padding:20px 0;}
  .metro-pulse{
    width:80px;height:80px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
    font-family:'Fraunces', serif;font-size:30px;color:var(--ink);transition:transform .1s ease, background .1s ease;
  }

  /* écran de démarrage avec le logo */
  #appSplash{position:fixed;inset:0;z-index:99999;background:#F6F9F7;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;overflow:hidden;animation:splashOut .6s ease 4.4s forwards;}
  #appSplash .sp-stage{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center;margin-top:-30px;}
  #appSplash .sp-logo{position:relative;z-index:2;width:158px;height:158px;border-radius:50%;animation:splashIn 1.3s cubic-bezier(.2,.8,.2,1) both;}
  #appSplash .sp-halo{position:absolute;inset:0;width:100%;height:100%;z-index:1;animation:haloIn 1.6s ease .2s both, haloSpin 24s linear infinite;}
  #appSplash .sp-spark{position:absolute;z-index:3;animation:spTw 2.4s ease-in-out infinite;transform:translate(-50%,-50%);}
  #appSplash .sp-spark.b{animation-delay:.5s;} #appSplash .sp-spark.c{animation-delay:1s;} #appSplash .sp-spark.d{animation-delay:1.5s;}
  #appSplash .sp-spark.e{animation-delay:.8s;} #appSplash .sp-spark.f{animation-delay:1.9s;}
  #appSplash .sp-name{font-family:'Fraunces',serif;font-size:32px;font-weight:500;color:#1F5469;letter-spacing:.02em;animation:splashIn 1.3s ease .5s both;}
  #appSplash .sp-orn{display:flex;align-items:center;gap:10px;color:#7FB0B0;animation:splashIn 1.3s ease .95s both;}
  #appSplash .sp-orn i{display:block;width:56px;height:1px;background:linear-gradient(90deg,transparent,#7FB0B0);}
  #appSplash .sp-orn i:last-child{transform:scaleX(-1);}
  #appSplash .sp-diam{display:flex;gap:9px;align-items:center;animation:splashIn 1.3s ease 1.3s both;}
  #appSplash .sp-diam b{display:block;width:6px;height:6px;background:#7FB0B0;transform:rotate(45deg);opacity:.9;}
  #appSplash .sp-diam b:nth-child(2),#appSplash .sp-diam b:nth-child(4){width:4px;height:4px;opacity:.6;}
  #appSplash .sp-diam b:nth-child(3){width:8px;height:8px;background:#1F5469;}
  #appSplash .sp-corner{position:absolute;opacity:.85;animation:splashIn 1.3s ease .3s both;}
  #appSplash .sp-corner.tl{top:max(18px,env(safe-area-inset-top));left:16px;}
  #appSplash .sp-corner.tr{top:max(18px,env(safe-area-inset-top));right:16px;transform:scaleX(-1);}
  #appSplash .sp-corner.bl{bottom:16px;left:16px;transform:scaleY(-1);}
  #appSplash .sp-corner.br{bottom:16px;right:16px;transform:scale(-1,-1);}
  #appSplash .sp-birds{position:absolute;top:13%;left:50%;margin-left:-60px;opacity:.75;animation:birdsFly 5s ease-out both;}
  #appSplash .sp-waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:110px;opacity:.95;animation:wavesUp 1.6s ease .6s both;}
  @keyframes splashIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:none;}}
  @keyframes haloIn{from{opacity:0;transform:scale(.7) rotate(-30deg);}to{opacity:.9;transform:scale(1) rotate(0);}}
  @keyframes haloSpin{to{rotate:360deg;}}
  @keyframes spTw{0%,100%{opacity:.25;scale:.7;}50%{opacity:1;scale:1.2;}}
  @keyframes birdsFly{from{opacity:0;transform:translateX(-40px);}25%{opacity:.75;}to{opacity:.75;transform:translateX(50px);}}
  @keyframes wavesUp{from{opacity:0;transform:translateY(40px);}to{opacity:.95;transform:none;}}
  @keyframes splashOut{to{opacity:0;visibility:hidden;}}
  @media (prefers-reduced-motion:reduce){#appSplash{animation-duration:.01s;animation-delay:.4s;}.hh-deco .tw,#appSplash .sp-halo,#appSplash .sp-spark{animation:none;}}
  </style>
</head>

<script>
// Si l'app n'est pas ouverte dans Claude (donc window.storage n'existe pas),
// on utilise le stockage du navigateur (localStorage) à la place, de façon transparente.
if(!window.storage){
  window.storage = {
    async get(key){
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared:false };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value, shared:false };
    },
    async delete(key){
      localStorage.removeItem(key);
      return { key, deleted:true, shared:false };
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, shared:false };
    }
  };
}

async function persist(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ console.error('Save failed', e); }
}
function toggleDone(id){
  const entry = state[id] || {done:false, note:''};
  entry.done = !entry.done;
  state[id] = entry;
  renderLetters();
  persist();
}
function saveNote(id, value){
  const entry = state[id] || {done:false, note:''};
  entry.note = value;
  state[id] = entry;
  persist();
}
async function loadState(){
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value) state = JSON.parse(result.value);
  }catch(e){ state = {}; }
  renderLetters();
}

// ---- Quiz : moteur générique avec niveaux de difficulté ----
const FLAT_LETTERS = [];
Object.entries(LETTERS).forEach(([zone, arr])=>{
  arr.forEach((l, idx)=> FLAT_LETTERS.push({zone, idx, l}));
});
const FLAT_RULES = [];
RULES.forEach(cat=>{ cat.items.forEach(it=> FLAT_RULES.push({cat, it})); });

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function genZone(){
  const t = UI[lang];
  const item = pickRandom(FLAT_LETTERS);
  const zones = ['gorge','langue','levres'];
  const zoneLabels = {gorge:t.zoneGorge, langue:t.zoneLangue, levres:t.zoneLevres};
  const options = zones.map(z=>zoneLabels[z]);
  return {
    display: item.l.ar, displayIsText:false,
    prompt: t.quizGuess,
    options, correctIndex: zones.indexOf(item.zone),
    explanation: item.l[lang].tip
  };
}

function genLetterName(hard){
  const t = UI[lang];
  const item = pickRandom(FLAT_LETTERS);
  const correctName = item.l[lang].name;
  let pool = hard
    ? FLAT_LETTERS.filter(x => x.zone === item.zone && x.l[lang].name !== correctName)
    : FLAT_LETTERS.filter(x => x.l[lang].name !== correctName);
  if(pool.length < 3) pool = FLAT_LETTERS.filter(x => x.l[lang].name !== correctName);
  const distractors = shuffle(pool).slice(0,3).map(x => x.l[lang].name);
  const options = shuffle([correctName, ...distractors]);
  return {
    display: item.l.ar, displayIsText:false,
    prompt: t.qLetterName,
    options, correctIndex: options.indexOf(correctName),
    explanation: item.l[lang].desc + ' — ' + item.l[lang].tip
  };
}

function genSifatMatch(){
  const t = UI[lang];
  const item = pickRandom(SIFAT);
  const correctDesc = item[lang].desc;
  const pool = shuffle(SIFAT.filter(s => s !== item)).slice(0,3).map(s => s[lang].desc);
  const options = shuffle([correctDesc, ...pool]);
  return {
    display: item[lang].name, displayIsText:true,
    prompt: t.qSifat(item[lang].name),
    options, correctIndex: options.indexOf(correctDesc),
    explanation: correctDesc
  };
}

function genRuleName(){
  const t = UI[lang];
  const item = pickRandom(FLAT_RULES);
  const correctName = item.it[lang].name;
  const correctDesc = item.it[lang].desc;
  let pool = FLAT_RULES.filter(x => x.it[lang].name !== correctName);
  const distractors = shuffle(pool).slice(0,3).map(x => x.it[lang].name);
  const options = shuffle([correctName, ...distractors]);
  return {
    display: null, displayIsText:false,
    prompt: t.qRule(correctDesc),
    options, correctIndex: options.indexOf(correctName),
    explanation: item.cat[lang] + ' — ' + correctName
  };
}

function genRiskPair(){
  const t = UI[lang];
  const item = pickRandom(RISK_PAIRS);
  const correctDesc = item[lang];
  const pool = shuffle(RISK_PAIRS.filter(r => r !== item)).slice(0,3).map(r => r.pair);
  const options = shuffle([item.pair, ...pool]);
  return {
    display: null, displayIsText:false,
    prompt: correctDesc,
    promptIsQuestion:true,
    options, correctIndex: options.indexOf(item.pair),
    explanation: t.qRisk
  };
}

const QUESTION_POOLS = {
  easy: [ genZone, genZone, () => genLetterName(false) ],
  medium: [ () => genLetterName(false), genSifatMatch, genZone ],
  hard: [ () => genLetterName(true), genRuleName, genRiskPair, genSifatMatch ]
};

let flashDeck = [];
let flashIdx = 0;
let flashRevealed = false;
let flashStats = { know: 0, review: 0 };

function buildFlashDeck(){
  flashDeck = shuffle(FLASHCARD_ITEMS);
  flashIdx = 0;
  flashRevealed = false;
  flashStats = { know: 0, review: 0 };
}

function renderFlashMode(container){
  const t = UI[lang];
  if(flashDeck.length === 0) buildFlashDeck();

  if(flashIdx >= flashDeck.length){
    container.innerHTML = `
      <div class="flash-progress">${t.flashProgress(flashDeck.length, flashDeck.length, flashStats.know, flashStats.review)}</div>
      <div class="flash-card"><div class="flash-back" style="display:block;">${t.flashDone}</div></div>
      <div class="flash-actions"><button class="flash-btn reveal" id="flashRestart">${t.flashRestart}</button></div>
    `;
    document.getElementById('flashRestart').addEventListener('click', ()=>{ buildFlashDeck(); renderFlashMode(container); });
    return;
  }

  const item = flashDeck[flashIdx][lang];
  container.innerHTML = `
    <div class="flash-progress">${t.flashProgress(flashIdx + 1, flashDeck.length, flashStats.know, flashStats.review)}</div>
    <div class="flash-card${flashRevealed ? ' revealed' : ''}" id="flashCard">
      <div class="flash-front" style="${item.frontIsAr ? '' : 'font-family:\'Fraunces\',serif;font-size:22px;'}">${item.front}</div>
      <div class="flash-back">${item.back}</div>
    </div>
    <div class="flash-actions">
      ${flashRevealed
        ? `<button class="flash-btn review" id="flashReviewBtn">${t.flashReview}</button><button class="flash-btn know" id="flashKnowBtn">${t.flashKnow}</button>`
        : `<button class="flash-btn reveal" id="flashRevealBtn">${t.flashReveal}</button>`}
    </div>
  `;
  document.getElementById('flashCard').addEventListener('click', ()=>{
    if(!flashRevealed){ flashRevealed = true; renderFlashMode(container); }
  });
  if(!flashRevealed){
    document.getElementById('flashRevealBtn').addEventListener('click', ()=>{ flashRevealed = true; renderFlashMode(container); });
  } else {
    document.getElementById('flashKnowBtn').addEventListener('click', ()=>{
      flashStats.know++; lifetimeStats.quizCorrect = (lifetimeStats.quizCorrect || 0) + 1; persistLifetimeStats(); flashIdx++; flashRevealed = false; renderFlashMode(container);
    });
    document.getElementById('flashReviewBtn').addEventListener('click', ()=>{
      flashStats.review++; flashDeck.push(flashDeck[flashIdx]); flashIdx++; flashRevealed = false; renderFlashMode(container);
    });
  }
}

function genTrueFalse(){

      tfScore.total++;
      const rightBtn = container.querySelector(`.tf-opt[data-guess="${isTrue}"]`);
      if(guess === isTrue){

// ---- Mode Association (matching game) ----
let matchCards = [];
let matchSelected = [];

function buildMatchRound(){
  const items = shuffle(FLAT_LETTERS).slice(0, 4);
  matchCards = [];
  items.forEach((it, i)=>{
    matchCards.push({ id:'ar'+i, pairId:i, value: it.l.ar, isAr:true, matched:false });
    matchCards.push({ id:'nm'+i, pairId:i, value: it.l[lang].name, isAr:false, matched:false });
  });
  matchCards = shuffle(matchCards);
  matchSelected = [];
}

function renderMatchMode(container){
  const t = UI[lang];
  if(matchCards.length === 0) buildMatchRound();
  const allMatched = matchCards.every(c=>c.matched);
  container.innerHTML = `
    <p class="sub" style="margin-bottom:14px;">${t.matchInstructions}</p>
    <div class="match-grid">
      ${matchCards.map(c => `
        <button class="match-card${c.matched ? ' matched' : ''}${matchSelected.includes(c.id) ? ' selected' : ''}"
                data-id="${c.id}" ${c.matched ? 'disabled' : ''}
                style="${c.isAr ? '' : 'font-family:\'Source Sans 3\',sans-serif;font-size:12px;font-weight:600;'}">${c.value}</button>
      `).join('')}
    </div>
    ${allMatched ? `<div style="text-align:center;"><button class="quiz-next" id="matchNewBtn">${t.matchNew}</button></div>` : ''}
  `;
  container.querySelectorAll('.match-card').forEach(btn=>{
    btn.addEventListener('click', ()=> handleMatchClick(btn.dataset.id, container));
  });
  if(allMatched){
    document.getElementById('matchNewBtn').addEventListener('click', ()=>{ matchCards = []; renderMatchMode(container); });
  }
}

function handleMatchClick(id, container){
  if(matchSelected.includes(id)) return;
  const card = matchCards.find(c => c.id === id);
  if(card.matched) return;
  matchSelected.push(id);
  if(matchSelected.length === 2){
    const [id1, id2] = matchSelected;
    const c1 = matchCards.find(c => c.id === id1);
    const c2 = matchCards.find(c => c.id === id2);
    if(c1.pairId === c2.pairId && c1.isAr !== c2.isAr){
      c1.matched = true; c2.matched = true;
      matchSelected = [];
      renderMatchMode(container);
      if(matchCards.every(c=>c.matched)){
        lifetimeStats.matchRounds = (lifetimeStats.matchRounds || 0) + 1;
        persistLifetimeStats();
        renderBadges();
      }
    } else {
      renderMatchMode(container);
      setTimeout(()=>{ matchSelected = []; renderMatchMode(container); }, 700);
    }
  } else {
    renderMatchMode(container);
  }
}

// ---- Métronome des madd ----
let metroInterval = null;
let metroBeat = 0;
let metroTotal = 4;
let audioCtx = null;

function beep(strong){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = strong ? 880 : 600;
  gain.gain.value = 0.15;
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
  osc.stop(audioCtx.currentTime + 0.13);
}

function renderMetroDots(){
  document.getElementById('metroDots').innerHTML = Array.from({length: metroTotal}).map((_, i) => `
    <span class="metro-dot${i === metroBeat ? ' active' : ''}"></span>
  `).join('');
  document.getElementById('metroCount').textContent = metroBeat + 1;
}

function renderMetroLengths(){
  const opts = [2, 4, 6];
  document.getElementById('metroLengths').innerHTML = opts.map(n => `
    <button class="${n === metroTotal ? 'active' : ''}" data-len="${n}">${n}</button>
  `).join('');
  document.querySelectorAll('#metroLengths button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      metroTotal = parseInt(btn.dataset.len, 10);
      metroBeat = 0;
      renderMetroLengths();
      renderMetroDots();
    });
  });
}

function toggleMetronome(){
  const t = UI[lang];
  const btn = document.getElementById('metroToggle');
  if(metroInterval){
    clearInterval(metroInterval);
    metroInterval = null;
    btn.textContent = t.metroStart;
    btn.classList.remove('stop');
  } else {
    metroBeat = -1;
    metroInterval = setInterval(()=>{
      metroBeat = (metroBeat + 1) % metroTotal;
      beep(metroBeat === 0);
      renderMetroDots();
    }, 700);
    btn.textContent = t.metroStop;
    btn.classList.add('stop');
  }
}

// ---- Répétition espacée ----
const REVIEW_INTERVALS_DAYS = [1, 3, 7, 14, 30, 60];
function todayStr(){ return new Date().toISOString().slice(0, 10); }
function addDaysStr(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
async function scheduleReview(num, stage){
  const nextDue = addDaysStr(todayStr(), REVIEW_INTERVALS_DAYS[Math.min(stage, REVIEW_INTERVALS_DAYS.length - 1)]);
  try{
    await window.storage.set('quran-review-' + num, JSON.stringify({stage, nextDue}), false);
  }catch(e){}
}
async function clearReview(num){
  try{ await window.storage.delete('quran-review-' + num, false); }catch(e){}
}
async function getReview(num){
  try{
    const r = await window.storage.get('quran-review-' + num, false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function markReviewed(num){
  const rev = await getReview(num);
  const stage = rev ? rev.stage + 1 : 0;
  await scheduleReview(num, stage);
}
async function getDueReviews(){
  const due = [];
  try{
    const result = await window.storage.list('quran-review-', false);
    const keys = (result && result.keys) || [];
    const today = todayStr();
    for(const k of keys){
      const num = parseInt(k.replace('quran-review-',''), 10);
      const r = await window.storage.get(k, false).catch(()=>null);
      if(r){
        const data = JSON.parse(r.value);
        if(data.nextDue <= today) due.push(num);
      }
    }
  }catch(e){}
  return due;
}

async function bumpDailyLog(){
  const log = await getDailyLog();
  const today = todayStr();
  log[today] = (log[today] || 0) + 1;
  try{ await window.storage.set('quran-daily-log', JSON.stringify(log), false); }catch(e){}
}
async function computeStreak(){
  const log = await getDailyLog();
  const goal = await getDailyGoal();
  let streak = 0;
  let cursor = todayStr();
  // Si l'objectif du jour n'est pas encore atteint, on commence le comptage à hier
  // (pour ne pas casser la série avant la fin de la journée).
  if((log[cursor] || 0) < goal) cursor = addDaysStr(cursor, -1);
  while((log[cursor] || 0) >= goal){
    streak++;
    cursor = addDaysStr(cursor, -1);
  }
  return streak;
}

const AUDIO_CACHE_NAME = 'quran-audio-v1';
const RECORDING_CACHE_NAME = 'user-recordings-v1';
let currentMediaRecorder = null;
let currentRecordingChunks = [];
let currentRecordingGlobalNum = null;

function recordingKey(globalNum){
  return `recording://${globalNum}`;
}

async function getRecording(globalNum){
  try{
    const cache = await caches.open(RECORDING_CACHE_NAME);
    const res = await cache.match(recordingKey(globalNum));
    if(!res) return null;
    return await res.blob();
  }catch(e){ return null; }
}

async function saveRecording(globalNum, blob){
  try{
    const cache = await caches.open(RECORDING_CACHE_NAME);
    const res = new Response(blob, { headers: { 'Content-Type': blob.type || 'audio/webm' } });
    await cache.put(recordingKey(globalNum), res);
  }catch(e){}
}

async function deleteRecording(globalNum){
  try{
    const cache = await caches.open(RECORDING_CACHE_NAME);
    await cache.delete(recordingKey(globalNum));
  }catch(e){}
}

async function startAyahRecording(globalNum, box){
  const t = UI[lang];
  if(currentMediaRecorder){
    return; // un enregistrement est déjà en cours ailleurs
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert(t.quranRecordUnsupported);
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    currentRecordingChunks = [];
    currentRecordingGlobalNum = globalNum;
    currentMediaRecorder = new MediaRecorder(stream);
    currentMediaRecorder.ondataavailable = (e)=>{ if(e.data.size > 0) currentRecordingChunks.push(e.data); };
    currentMediaRecorder.onstop = async ()=>{
      const blob = new Blob(currentRecordingChunks, { type: 'audio/webm' });
      await saveRecording(globalNum, blob);
      stream.getTracks().forEach(track => track.stop());
      currentMediaRecorder = null;
      currentRecordingChunks = [];
      currentRecordingGlobalNum = null;
      renderAyahRecordingBox(globalNum, box);
    };
    currentMediaRecorder.start();
    renderAyahRecordingBox(globalNum, box, true);
  }catch(e){
    alert(t.quranRecordDenied);
  }
}

function stopAyahRecording(){
  if(currentMediaRecorder && currentMediaRecorder.state !== 'inactive'){
    currentMediaRecorder.stop();
  }
}

async function renderAyahRecordingBox(globalNum, box, isRecording){
  const t = UI[lang];
  if(!box) box = document.querySelector(`.ayah-recording-box[data-recording-box="${globalNum}"]`);
  if(!box) return;

  if(isRecording){
    box.innerHTML = `
      <div class="ayah-recording-active">
        <span class="arb-dot"></span> ${t.quranRecordingInProgress}
        <button data-stop-record="${globalNum}">${t.quranRecordStop}</button>
      </div>
    `;
    box.querySelector('[data-stop-record]').addEventListener('click', stopAyahRecording);
    return;
  }

  const blob = await getRecording(globalNum);
  if(!blob){
    box.innerHTML = '';
    return;
  }
  const url = URL.createObjectURL(blob);
  box.innerHTML = `
    <div class="ayah-recording-saved">
      <audio controls src="${url}"></audio>
      <button data-delete-record="${globalNum}" title="${t.quranRecordDelete}">🗑️</button>
    </div>
  `;
  box.querySelector('[data-delete-record]').addEventListener('click', async ()=>{
    await deleteRecording(globalNum);
    URL.revokeObjectURL(url);
    renderAyahRecordingBox(globalNum, box);
  });
}

// Certains récitateurs n'existent pas sous le même nom / la même qualité sur le serveur audio.
// L'app teste les variantes une fois, retient celle qui marche, et l'utilise partout (écoute + téléchargement).
const RECITER_ALIASES={'ar.ajamy':'ar.ahmedajamy','ar.sudais':'ar.abdurrahmaansudais','ar.shuraim':'ar.saoodshuraym','ar.abdulbasit':'ar.abdulbasitmurattal','ar.muhammadayoub':'ar.muhammadayyoub'};
const reciterUrlInfo={}, reciterResolving={};
function probeAudio(url){
  return new Promise(res=>{
    const a=new Audio(); let done=false;
    const end=ok=>{ if(done)return; done=true; a.onloadedmetadata=a.oncanplay=a.onerror=null; a.removeAttribute('src'); a.load(); res(ok); };
    a.preload='metadata'; a.onloadedmetadata=a.oncanplay=()=>end(true); a.onerror=()=>end(false);
    setTimeout(()=>end(false),7000); a.src=url;
  });
}
function resolveReciter(id){
  if(reciterUrlInfo[id]) return Promise.resolve();
  if(!reciterResolving[id]) reciterResolving[id]=(async()=>{
    try{ const r=await window.storage.get('quran-reciter-url-'+id,false);
      if(r&&r.value){ const [ed,br]=r.value.split('|'); reciterUrlInfo[id]={ed,br}; return; } }catch(e){}
    const eds=[id]; if(RECITER_ALIASES[id]) eds.push(RECITER_ALIASES[id]);
    for(const br of [128,192,64,48,40,32]) for(const ed of eds){
      if(await probeAudio(`https://cdn.islamic.network/quran/audio/${br}/${ed}/1.mp3`)){
        reciterUrlInfo[id]={ed,br};
        try{ await window.storage.set('quran-reciter-url-'+id,ed+'|'+br,false); }catch(e){}
        return;
      }
    }
    delete reciterResolving[id]; // hors-ligne ou échec : on réessaiera plus tard
  })();
  return reciterResolving[id];
}
function resolveSoon(id){ return Promise.race([resolveReciter(id),new Promise(r=>setTimeout(r,3000))]); }
function ayahAudioUrl(globalNum){
  const i=reciterUrlInfo[quranReciter]||{ed:quranReciter,br:128};
  return `https://cdn.islamic.network/quran/audio/${i.br}/${i.ed}/${globalNum}.mp3`;
}

async function playFullSurahAudio(num, ayahListForFallback){

  await resolveReciter(quranReciter);
  const el = getQuranAudioEl();

  // d'un seul verset via le bouton ▶ à côté de chaque verset).
  el.src = surahAudioUrl(num);

    // on bascule automatiquement sur l'enchaînement verset par verset plutôt que
    // d'afficher une erreur (petite coupure entre versets, mais ça marche toujours).

  quranAudioState.index = 0;
  quranAudioState.consecutiveFails = 0;
  quranAudioState.playing = true;
  const btn = document.getElementById('playSurahBtn');
  if(btn) btn.textContent = UI[lang].quranPauseSurah;
  playNextInQueue();
}
function playNextInQueue(){
  if(quranAudioState.index >= quranAudioState.queue.length){
    const endCb = quranAudioState.onQueueEnd;
    stopQuranAudio();
    if(endCb) endCb();
    return;
  }
  document.querySelectorAll('.ayah-item.playing').forEach(x => x.classList.remove('playing'));
  const globalNum = quranAudioState.queue[quranAudioState.index];
  if(quranAudioState.onAyahStart) quranAudioState.onAyahStart(globalNum);
  const item = document.querySelector(`.ayah-item[data-global-num="${globalNum}"]`);
  if(item){ item.classList.add('playing'); item.scrollIntoView({behavior:'smooth', block:'center'}); }
  const el = getQuranAudioEl();
  // Le service worker sert automatiquement la version mise en cache si elle a été
  // téléchargée à l'avance et qu'on est hors-ligne (voir service-worker.js).
  el.src = ayahAudioUrl(globalNum);
  el.play().catch(()=> handleAyahAudioFailure());
  preloadNextAyahInQueue();
  el.onended = ()=>{
    quranAudioState.consecutiveFails = 0;

    quranAudioState.index++;
    playNextInQueue();
  };
  el.onerror = handleAyahAudioFailure;
}
function handleAyahAudioFailure(){
  const t = UI[lang];
  quranAudioState.consecutiveFails = (quranAudioState.consecutiveFails || 0) + 1;
  const isFullSurah = quranAudioState.queue.length > 1;
  // Si plusieurs échecs d'affilée (probablement hors-ligne / pas de réseau), on arrête
  // plutôt que de sauter frénétiquement tous les versets un par un.
  if(!isFullSurah || quranAudioState.consecutiveFails >= 3){
    stopQuranAudio();
    alert(t.quranAudioError);
    return;
  }
  // Un seul verset en échec pendant la lecture de la sourate entière : on le saute
  // et on continue avec le suivant, sans interrompre toute la lecture.
  quranAudioState.index++;
  playNextInQueue();
}

function todayDateKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function getPrayerTimesForCity(city){
  const key = `prayer-v3-${city.id}-${todayDateKey()}`;
  const cached = await getCachedQuran(key);
  if(cached) return cached;
  // Coordonnées précises plutôt qu'une recherche par nom de ville, pour un calcul
  // fidèle à la position exacte (la recherche par nom peut géolocaliser de façon
  // approximative et décaler les horaires de quelques minutes).
  // Léger ajustement (tune) calibré sur l'Isha pour coller à la référence Diyanet
  // observée (les autres horaires collaient déjà à 0-1 min près).
  const url = `https://api.aladhan.com/v1/timings/${todayDateKey().split('-').reverse().join('-')}?latitude=${city.lat}&longitude=${city.lng}&method=${PRAYER_METHOD}&timezonestring=Europe/Paris&tune=0,0,0,0,0,0,0,-5,0`;
  const res = await fetch(url);
  const data = await res.json();
  const timings = data.data.timings;
  const result = {
    fajr: timings.Fajr, sunrise: timings.Sunrise, dhuhr: timings.Dhuhr,
    asr: timings.Asr, maghrib: timings.Maghrib, isha: timings.Isha,
    date: data.data.date.readable
  };
  await setCachedQuran(key, result);
  return result;
}

function findNextPrayer(times){
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const order = ['fajr','sunrise','dhuhr','asr','maghrib','isha'];
  for(const key of order){
    const [h, m] = times[key].split(':').map(n => parseInt(n, 10));
    if(h * 60 + m > nowMinutes) return key;
  }
  return 'fajr'; // après Isha, la prochaine est le Fajr du lendemain
}

function nextPrayerTargetDate(times, nextKey){
  const [h, m] = times[nextKey].split(':').map(n => parseInt(n, 10));
  const target = new Date();
  target.setHours(h, m, 0, 0);
  if(target.getTime() <= Date.now()){
    // Le Fajr du lendemain (dernier créneau de la journée déjà passé).
    target.setDate(target.getDate() + 1);
  }
  return target;
}

function formatCountdown(ms){
  if(ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

let quranTOC = null;
let quranJuzIndex = null;
async function ensureQuranFullIndex(){
  if(quranTOC && quranJuzIndex && quranJuzIndex.length > 0) return;
  if(!quranTOC){
    const cachedTOC = await getCachedQuran('quran-toc');
    if(cachedTOC && cachedTOC.length > 0) quranTOC = cachedTOC;
  }
  if(!quranJuzIndex || quranJuzIndex.length === 0){
    const cachedJuz = await getCachedQuran('quran-juz-index');
    if(cachedJuz && cachedJuz.length > 0) quranJuzIndex = cachedJuz;
  }
  if(quranTOC && quranJuzIndex && quranJuzIndex.length > 0) return;

  // On récupère le Coran entier une seule fois pour connaître la vraie page et le vrai
  // Cüz de départ de chaque sourate (données officielles de pagination), puis on ne
  // garde que ces nombres — pas le texte — pour rester léger.
  const res = await fetch('https://api.alquran.cloud/v1/quran/quran-simple');
  const data = await res.json();

  if(!quranTOC){
    quranTOC = data.data.surahs.map(s => ({
      number: s.number,
      name: s.name,
      englishName: s.englishName,
      page: s.ayahs[0].page,
      juz: s.ayahs[0].juz
    }));
    await setCachedQuran('quran-toc', quranTOC);
  }

  if(!quranJuzIndex){
    // Index des 30 Cüz : certains commencent en plein milieu d'une sourate,
    // pas seulement au début d'une nouvelle — d'où le passage par les ayahs.
    const seenJuz = new Set();
    const juzIdx = [];
    data.data.surahs.forEach(s => {
      s.ayahs.forEach(a => {
        if(!seenJuz.has(a.juz)){
          seenJuz.add(a.juz);
          juzIdx.push({ juz: a.juz, surahNumber: s.number, ayahNumberInSurah: a.numberInSurah, page: a.page });
        }
      });
    });
    quranJuzIndex = juzIdx;
    await setCachedQuran('quran-juz-index', juzIdx);
  }
}
async function getQuranTOC(){
  await ensureQuranFullIndex();
  return quranTOC;
}
async function getQuranJuzIndex(){
  await ensureQuranFullIndex();
  return quranJuzIndex || [];
}

async function downloadAllQuranAudio(){
  if(quranDownloadState.active) return;
  const t = UI[lang];
  if(!confirm(t.quranDownloadConfirm)) return;
  await resolveReciter(quranReciter);

  quranDownloadState.active = true;
  quranDownloadState.cancelled = false;
  quranDownloadState.done = 0;
  quranDownloadState.failed = 0;
  const ayahTotal = await getTotalAyahCount();
  const surahTotal = 114; // les 114 fichiers "sourate entière" pour l'écoute fluide hors-ligne
  quranDownloadState.total = ayahTotal + surahTotal;
  renderSurahList(); // pour afficher la barre de progression

  const cache = await caches.open(AUDIO_CACHE_NAME);
  const CONCURRENCY = 4;

  async function cacheUrl(url){
    try{
      const existing = await cache.match(url);
      if(!existing){
        const resp = await fetch(url);
        if(resp.ok) await cache.put(url, resp);
        else quranDownloadState.failed++;
      }
    }catch(e){
      quranDownloadState.failed++;
    }
    quranDownloadState.done++;
    updateDownloadProgressUI();
  }

  // 1) Fichiers verset par verset (pour l'écoute d'un seul verset et la recherche
  // dans le texte hors-ligne).
  let nextAyahNum = 1;
  async function ayahWorker(){
    while(nextAyahNum <= ayahTotal && !quranDownloadState.cancelled){
      await cacheUrl(ayahAudioUrl(nextAyahNum++));
    }
  }
  await Promise.all(Array.from({length: CONCURRENCY}, () => ayahWorker()));

  // 2) Fichiers "sourate entière" (pour l'écoute fluide sans coupure, hors-ligne aussi).
  let nextSurahNum = 1;
  async function surahWorker(){
    while(nextSurahNum <= surahTotal && !quranDownloadState.cancelled){
      await cacheUrl(surahAudioUrl(nextSurahNum++));
    }
  }
  if(!quranDownloadState.cancelled){
    await Promise.all(Array.from({length: CONCURRENCY}, () => surahWorker()));
  }

  quranDownloadState.active = false;
  if(quranDownloadState.cancelled){
    alert(t.quranDownloadCancelled);
  }else{
    alert(t.quranDownloadDone);
  }
  renderSurahList();
}

function computeMushafPages(s){
  const pages = [];
  let current = null;
  s.ayahs.forEach((a, i) => {
    const pageNum = a.page || 1;
    if(!current || current.page !== pageNum){
      current = { page: pageNum, juz: a.juz, items: [] };
      pages.push(current);
    }
    current.items.push({ a, i });
  });
  return pages;
}

var qiblaState={bearing:null,heading:null,handler:null};
function stopQibla(){
  if(qiblaState.handler){ window.removeEventListener('deviceorientationabsolute',qiblaState.handler,true); window.removeEventListener('deviceorientation',qiblaState.handler,true); qiblaState.handler=null; }
}
function qiblaBearing(lat,lon){
  const r=Math.PI/180, kl=21.4225*r, kn=39.8262*r, f=lat*r, d=kn-lon*r;
  return (Math.atan2(Math.sin(d)*Math.cos(kl), Math.cos(f)*Math.sin(kl)-Math.sin(f)*Math.cos(kl)*Math.cos(d))*180/Math.PI+360)%360;
}
function updateQibla(){
  const ar=document.getElementById('qArrow'); if(!ar||qiblaState.bearing==null) return;
  const h=qiblaState.heading, rot=h==null?qiblaState.bearing:(qiblaState.bearing-h+360)%360;
  ar.style.transform=`rotate(${rot}deg)`;
  const st=document.getElementById('qStatus'), ok=h!=null&&Math.min(rot,360-rot)<5;
  st.textContent=h==null?`Qibla : ${Math.round(qiblaState.bearing)}° par rapport au nord (boussole indisponible).`
    :(ok?'✅ Tu fais face à la Qibla':`Tourne jusqu'à ce que la flèche pointe vers le haut (Qibla : ${Math.round(qiblaState.bearing)}°)`);
}
async function startQibla(){
  const st=document.getElementById('qStatus'); st.textContent='Recherche de ta position…';
  try{ if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(e){}
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:12000}));
    qiblaState.bearing=qiblaBearing(pos.coords.latitude,pos.coords.longitude);
  }catch(e){ st.textContent='Position refusée ou indisponible — autorise la localisation pour cette app.'; return; }
  stopQibla();
  qiblaState.handler=ev=>{ let h=null; if(ev.webkitCompassHeading!=null) h=ev.webkitCompassHeading; else if(ev.absolute&&ev.alpha!=null) h=(360-ev.alpha)%360;
    if(h!=null){ qiblaState.heading=h; updateQibla(); } };
  window.addEventListener('deviceorientationabsolute',qiblaState.handler,true);
  window.addEventListener('deviceorientation',qiblaState.handler,true);
  updateQibla();
}

      w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
      v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
      glKeep=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'}))); glKeep.loop=true; }
    glKeep.play().catch(()=>{});
  }catch(e){}
  if('mediaSession' in navigator){
    try{

      const seek=d=>{ if(!glActive()) return; const q=glState.fullQueue, k=Math.max(0,Math.min(q.length-1,glState.base+glState.prog().i+d));
        playGapless(q.slice(k),Object.assign({},glState.hooks,{_full:q,_base:k})); };
      navigator.mediaSession.setActionHandler('play',()=>{ if(hzCtx) hzCtx.resume(); if(glKeep) glKeep.play().catch(()=>{}); });
      navigator.mediaSession.setActionHandler('pause',()=>{ if(hzCtx) hzCtx.suspend(); if(glKeep) glKeep.pause(); });
      navigator.mediaSession.setActionHandler('nexttrack',()=>seek(1));

    }catch(e){}
  }
}

function hzTrNode(root){
  if(lang!=='tr'||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ const v=n.nodeValue; if(!/[A-Za-zÀ-ÿ]/.test(v)) continue; const o=hzTrStr(v); if(o!==v) n.nodeValue=o; }
  if(root.querySelectorAll) root.querySelectorAll('[placeholder],[title]').forEach(e=>['placeholder','title'].forEach(a=>{
    const v=e.getAttribute(a); if(v){ const o=hzTrStr(v); if(o!==v) e.setAttribute(a,o); } }));
}
var hzObs=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(nd=>{
  if(nd.nodeType===1) hzTrNode(nd); else if(nd.nodeType===3&&nd.parentNode) hzTrNode(nd.parentNode); })));

// ================= CODE D'ACCÈS À LA PARTIE HAFIZ =================
var hzUnlocked=false;
async function hzHash(v){
  try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mahrec:'+v)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return 'p:'+btoa(unescape(encodeURIComponent(v))); }
}
async function hzGetPin(){ try{ const r=await window.storage.get('hafiz-pin',false); return (r&&r.value)?r.value:null; }catch(e){ return null; } }
async function hzLockOff(){ try{ const r=await window.storage.get('hafiz-pin-off',false); return !!(r&&r.value==='1'); }catch(e){ return false; } }
async function renderHafizGate(){
  const el=document.getElementById('hafizContent'), pin=await hzGetPin();
  const inp='width:100%;padding:12px;font-size:20px;text-align:center;letter-spacing:6px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);box-sizing:border-box;';
  el.innerHTML=`<div class="hz-card"><h3>🔒 ${pin?"Code d'accès":"Choisis un code d'accès"}</h3>
    <p class="sub" style="margin:0 0 8px">${pin?'Entre ton code pour ouvrir la partie Hafız.':'Ce code protégera la partie Hafız (4 chiffres ou plus).'}</p>
    <input type="password" inputmode="numeric" id="hzPinIn" placeholder="Code" style="${inp}">
    ${pin?'':`<input type="password" inputmode="numeric" id="hzPinIn2" placeholder="Confirmer le code" style="${inp}margin-top:8px">`}
    <p class="hz-lock" id="hzPinMsg" style="margin:8px 0 0"></p>
    <div class="hz-row"><button class="hz-btn" id="hzPinGo">${pin?'Ouvrir':'Enregistrer le code'}</button></div>
    ${pin?"<p class=\"sub\" style=\"font-size:11.5px\">Code oublié ? Il faut effacer les données du site dans les réglages du navigateur (la progression sera perdue — pense à exporter une sauvegarde).</p>":''}</div>`;
  const go=async()=>{
    const v=document.getElementById('hzPinIn').value.trim(), msg=document.getElementById('hzPinMsg');
    if(pin){ if(await hzHash(v)===pin){ hzUnlocked=true; renderHafiz(); } else { msg.textContent='Code incorrect.'; document.getElementById('hzPinIn').value=''; } return; }
    if(v.length<4){ msg.textContent='4 chiffres minimum.'; return; }
    if(v!==document.getElementById('hzPinIn2').value.trim()){ msg.textContent='Les deux codes ne correspondent pas.'; return; }
    try{ await window.storage.set('hafiz-pin',await hzHash(v),false); await window.storage.set('hafiz-pin-off','0',false); }catch(e){}
    hzUnlocked=true; renderHafiz();
  };
  document.getElementById('hzPinGo').onclick=go;
  document.getElementById('hzPinIn').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  hzTrNode(el);
}

function adhanChime(){
  try{ const c=hzGetCtx(), t0=c.currentTime+0.05;
    [523.25,659.25,783.99,1046.5].forEach((f,k)=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(c.destination);
      const t=t0+k*0.55; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.25,t+0.05); g.gain.exponentialRampToValueAtTime(0.001,t+1.6); o.start(t); o.stop(t+1.7); }); }catch(e){}
}
async function notify(title,body){
  try{ if(!('Notification' in window)||Notification.permission!=='granted') return;
    const r=await navigator.serviceWorker.getRegistration();
    if(r) r.showNotification(title,{body,icon:'icon-192.png'}); else new Notification(title,{body}); }catch(e){}
}

  }
  if(adhanCfg.remind&&hm>=adhanCfg.remindTime&&!adhanFired[today+'rem']){

}

// Déblocage de l'audio au tout premier toucher (les navigateurs, surtout iPhone, bloquent le son sinon)
(function(){
  let done=false, sil=null;
  const silent=()=>{ if(sil) return sil; const sr=8000,n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{ for(let k=0;k<t.length;k++) v.setUint8(o+k,t.charCodeAt(k)); };
    w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
    return sil=URL.createObjectURL(new Blob([b],{type:'audio/wav'})); };
  const unlock=()=>{
    if(done) return; done=true;
    try{ const c=hzGetCtx(), s2=c.createBufferSource(); s2.buffer=c.createBuffer(1,1,22050); s2.connect(c.destination); s2.start(0); }catch(e){}
    try{
      if(!glState) glState={els:[new Audio(),new Audio()],id:0,wa:null,prog:null};
      glState.els.forEach(e=>{ if(e.src) return; e.muted=true; e.src=silent(); const pr=e.play();
        if(pr&&pr.then) pr.then(()=>{ if(e.dataset.i){ e.muted=false; return; } e.pause(); e.muted=false; e.removeAttribute('src'); e.load(); }).catch(()=>{ e.muted=false; }); });
    }catch(e){}
    ['pointerdown','touchend','click'].forEach(ev=>document.removeEventListener(ev,unlock,true));
  };
  ['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,unlock,true));
})();

async function hzExam(box,gList,revMap){
  let idx; try{ idx=await bmIndex(); }catch(e){ box.innerHTML='<p class="sub">Connexion requise.</p>'; return; }
  const pool=gList.filter(g=>idx[g]&&idx[g+1]&&idx[g+1].s===idx[g].s);
  if(!pool.length){ box.innerHTML='<p class="sub">'+LL("Pas encore assez de pages apprises.","Henüz yeterli öğrenilmiş sayfa yok.")+'</p>'; return; }
  const qs=[...pool].sort(()=>Math.random()-0.5).slice(0,Math.min(5,pool.length)), res=[]; let i=0;
  const ask=()=>{
    if(i>=qs.length) return finish();
    const g=qs[i], exp=idx[g+1].text.split(/\s+/).filter(Boolean); hzLastScore=0;
    box.innerHTML=`<p class="sub" style="margin:0">${LL('Question','Soru')} ${i+1} / ${qs.length}</p>
      <p>${LL("Voici un verset. Récite le verset SUIVANT de mémoire.","İşte bir ayet. Bir SONRAKİ ayeti ezberden oku.")}</p>
      <div class="bm-ar">${idx[g].text}</div><p class="sub" style="margin:0">${localSurahName(idx[g].s)} ${idx[g].n}</p>
      <div class="hz-row"><button class="hz-btn alt" id="exPlay">▶</button><button class="hz-btn" id="exRec">🎤 ${LL('Je récite','Okuyorum')}</button></div>
      <div id="exBox"></div>
      <div class="hz-row"><button class="hz-btn gold" id="exOk">${LL('Valider ma réponse','Cevabımı onayla')}</button><button class="hz-btn alt" id="exShow">${LL('Voir la réponse','Cevabı gör')}</button></div>`;
    const $=id=>box.querySelector('#'+id);
    $('exPlay').onclick=()=>playQuranSurah([g]);
    $('exRec').onclick=()=>hzVoiceToggle($('exRec'),$('exBox'),exp);
    $('exShow').onclick=()=>{ hzLastScore=0; $('exBox').innerHTML='<div class="bm-ar">'+idx[g+1].text+'</div>'; };
    $('exOk').onclick=()=>{ if(hzRec) hzRec.stop(); res.push({g:g+1,score:hzLastScore}); i++; ask(); };
  };
  const finish=async()=>{
    const avg=Math.round(res.reduce((a,r)=>a+r.score,0)/res.length*100), weak=res.filter(r=>r.score<0.6), st=await hzGet(), today=todayDateKey(); let added=0;
    weak.forEach(r=>{ const pn=idx[r.g].page; if(revMap[pn]){ st.rev=st.rev||{}; st.rev[pn]={box:0,due:addDaysKey(today,1),last:today}; added++; } });
    if(added) await hzSet(st);
    box.innerHTML=`<p style="font-size:34px;margin:0"><strong>${avg} / 100</strong> ${avg>=80?'🎉':avg>=60?'👍':'💪'}</p>
      ${res.map(r=>`<div class="hz-hist">${localSurahName(idx[r.g].s)} ${idx[r.g].n} — ${Math.round(r.score*100)}%</div>`).join('')}
      ${added?`<p class="sub">${LL(`${added} page(s) faible(s) ajoutée(s) à tes révisions de demain.`,`${added} zayıf sayfa yarınki tekrarlarına eklendi.`)}</p>`:''}
      <div class="hz-row"><button class="hz-btn" id="exAgain">${LL('Refaire un examen','Yeni sınav')}</button></div>`;
    box.querySelector('#exAgain').onclick=()=>hzExam(box,gList,revMap);
  };
  ask();
}

async function acadGet(){ try{ const r=await window.storage.get('academy-v1',false); if(r&&r.value) return JSON.parse(r.value); }catch(e){} return []; }
var acadOpen=-1;
async function renderAcademy(box){
  const done=await acadGet(), tr=lang==='tr';
  if(acadOpen<0){
    box.innerHTML=`<p class="sub">${done.length} / ${ACAD.length} ${LL('leçons réussies','ders tamamlandı')}</p>`+ACAD.map((l,k)=>`<button class="tq-opt" data-k="${k}" style="text-align:left">${done.includes(k)?'✅':'📘'} ${k+1}. ${tr?l[1]:l[0]}</button>`).join('');
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ acadOpen=+b.dataset.k; renderAcademy(box); }); return;
  }
  const l=ACAD[acadOpen], q=l[5], qs=tr?q.slice(4):q.slice(0,4);
  let idx=null, maps=null; try{ idx=await bmIndex(); maps=bmMaps(idx); }catch(e){}
  const opts=qs.slice(1).map((t,k)=>({t,ok:k===0})).sort(()=>Math.random()-0.5);
  box.innerHTML=`<button class="hz-btn alt" id="acBack">‹ ${LL('Leçons','Dersler')}</button>
    <div class="hz-card"><h3>${acadOpen+1}. ${tr?l[1]:l[0]}</h3><p style="margin:0;line-height:1.6">${tr?l[3]:l[2]}</p>
    ${l[4].map(e=>`<div class="hz-row" style="justify-content:space-between"><span class="bm-ar" style="margin:0">${e[0]}</span><span class="sub">${e[1]}</span>${maps&&maps.rev[e[1]]?`<button class="hz-btn alt ac-play" data-g="${maps.rev[e[1]]}">▶</button>`:''}</div>`).join('')}</div>
    <div class="hz-card"><h3>❓ ${LL('Quiz','Test')}</h3><p style="margin:0"><strong>${qs[0]}</strong></p>${opts.map(o=>`<button class="tq-opt" data-ok="${o.ok?1:0}">${o.t}</button>`).join('')}<p id="acMsg" class="sub"></p></div>`;
  box.querySelector('#acBack').onclick=()=>{ acadOpen=-1; renderAcademy(box); };
  box.querySelectorAll('.ac-play').forEach(b=>b.onclick=()=>playQuranSurah([+b.dataset.g]));
  box.querySelectorAll('.tq-opt').forEach(b=>b.onclick=async()=>{
    box.querySelectorAll('.tq-opt').forEach(x=>{ x.disabled=true; if(x.dataset.ok==='1') x.classList.add('good'); });
    if(b.dataset.ok==='1'){ if(!done.includes(acadOpen)) done.push(acadOpen); try{ await window.storage.set('academy-v1',JSON.stringify(done),false); }catch(e){}
      box.querySelector('#acMsg').textContent='✅ '+LL('Bravo, leçon réussie !','Aferin, ders tamam!'); }
    else{ b.classList.add('bad'); box.querySelector('#acMsg').textContent=LL('Relis la leçon et réessaie.','Dersi tekrar oku ve yeniden dene.'); }
    setTimeout(()=>{ if(b.dataset.ok!=='1'){ renderAcademy(box); } },1500); });
}
async function srsGet(){ try{ const r=await window.storage.get('vocab-srs',false); if(r&&r.value) return JSON.parse(r.value); }catch(e){} return {}; }
async function renderCards(box){
  const srs=await srsGet(), today=todayDateKey(), tr=lang==='tr';
  const due=[], fresh=[]; VOCAB.forEach((v,k)=>{ const x=srs[k]; if(!x) fresh.push(k); else if(x.due<=today) due.push(k); });
  const queue=due.concat(fresh.slice(0,10));

    box.querySelector('#cdBack').innerHTML=`<p style="font-size:20px;margin:0 0 12px"><strong>${tr?v[2]:v[1]}</strong></p>

    box.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{
      const r=b.dataset.r, x=srs[k]||{box:0}; let bx=x.box; if(r==='good') bx=Math.min(6,bx+1); else if(r==='bad') bx=0;

}
function hzStreakOf(st){
  const days=new Set(st.validated.map(x=>x.date)), today=todayDateKey(); let n=0, d=days.has(today)?today:addDaysKey(today,-1);
  while(days.has(d)){ n++; d=addDaysKey(d,-1); } return n;
}
async function renderProfile(box){

  box.innerHTML=`<div class="hz-card"><h3>🏅 ${LL('Niveau','Seviye')} ${lvl} — ${title}</h3><div class="hz-bar"><div style="width:${pct}%"></div></div>
    <p class="sub" style="margin:8px 0 0">${pts} ${LL('points','puan')} · ${LL('prochain niveau à','sonraki seviye:')} ${nxt}</p></div>
    <div class="hz-card"><h3>${LL('Badges','Rozetler')} (${B.filter(b=>b[0]).length} / ${B.length})</h3><div style="display:flex;flex-wrap:wrap;gap:10px">${B.map(b=>`<div style="width:30%;text-align:center;opacity:${b[0]?1:.3}"><div style="font-size:30px">${b[1]}</div><div class="sub" style="font-size:11px">${b[2]}</div></div>`).join('')}</div></div>

}

function hzClose1(a,b){
  if(a===b) return true; if(a.length<4||Math.abs(a.length-b.length)>1) return false;
  let i=0,j=0,e=0;
  while(i<a.length&&j<b.length){ if(a[i]===b[j]){i++;j++;continue;} if(++e>1) return false; if(a.length>b.length)i++; else if(a.length<b.length)j++; else{i++;j++;} }
  return e+(a.length-i)+(b.length-j)<=1;
}
function hzVoiceShow(box,expected,heard,final=true){

  const flags=expected.map((w,i)=>{ const n=qfoNormalizeArabic(w); let f=-1;
    for(let k=j;k<Math.min(hw.length,j+4);k++) if(hzClose1(n,hw[k])){ f=k; break; }
    if(f>=0){ j=f+1; ok++; last=i; return 1; } return 0; });
  hzLastScore=expected.length?ok/expected.length:0;

async function hzSimilar(gList,box){

  const idx=await bmIndex();

    for(let g=1;g<=6236;g++){ if(!idx[g]) continue; const w=qfoNormalizeArabic(idx[g].text).split(/\s+/).filter(Boolean); W[g]=w;
      const seen=new Set(); for(let k=0;k+2<w.length;k++){ const gr=w[k]+' '+w[k+1]+' '+w[k+2]; if(seen.has(gr)) continue; seen.add(gr); (map.get(gr)||map.set(gr,[]).get(gr)).push(g); } }
    _gramData={W,map};

// ================= MODE HAFIZ (méthode ottomane : tours de plus en plus longs) =================
// Tour 1 : la dernière page de chaque Cüz (1→30). Tour 2 : les 2 dernières pages de chaque Cüz, etc.
function hzUnits(){
  const u=[];
  for(let r=1;r<=23;r++) for(let j=1;j<=30;j++){
    // Fin de chaque Cüz : 21, 41, 61 ... 581, puis 604 (Cüz 30 = pages 582 à 604)
    const end=j===30?604:20*j+1, start=j===1?1:20*(j-1)+2;
    if(r>end-start+1) continue;
    const first=end-r+1, pages=[];
    for(let p=first;p<=end;p++) pages.push(p);
    u.push({r,j,pages,newPage:first});
  }
  return u;
}

// Chaque verset est décodé puis programmé à la milliseconde près juste après le précédent
// (comme un lecteur vidéo) : aucun blanc. Les silences de début/fin de fichier sont rognés.
let hzCtx=null; const hzBufCache=new Map();
function hzGetCtx(){ const C=window.AudioContext||window.webkitAudioContext; if(!hzCtx) hzCtx=new C(); if(hzCtx.state==='suspended') hzCtx.resume(); return hzCtx; }
function hzTrim(buf){
  const d=buf.getChannelData(0), th=0.008, sr=buf.sampleRate; let a=0,b=d.length-1;
  while(a<b && Math.abs(d[a])<th) a++; while(b>a && Math.abs(d[b])<th) b--;
  const pad=Math.floor(sr*0.004); a=Math.max(0,a-pad); b=Math.min(d.length-1,b+pad);
  return {buf, off:a/sr, dur:(b-a+1)/sr};
}
function hzLoadBuf(url){

  const p=(async()=>{ const r=await fetch(url); if(!r.ok) throw new Error('http'); const ab=await r.arrayBuffer();
    const buf=await new Promise((res,rej)=>{ const q=hzGetCtx().decodeAudioData(ab,res,rej); if(q&&q.then) q.then(res,rej); }); return hzTrim(buf); })();
  hzBufCache.set(url,p); p.catch(()=>hzBufCache.delete(url));
  if(hzBufCache.size>40) hzBufCache.delete(hzBufCache.keys().next().value);
  return p;
}
function playGaplessWA(queue,hooks,my,onFail){
  const ctx=hzGetCtx(), starts=[]; let t=0, fired=0, allScheduled=false, fails=0, tick=null;
  const stop=()=>{ clearInterval(tick); starts.forEach(x=>{try{x.src.stop();}catch(e){}}); };
  glState.wa={stop};
  glState.prog=()=>{ const x=starts[Math.max(0,fired-1)]; return x?{i:x.idx,frac:Math.min(1,Math.max(0,(ctx.currentTime-x.when)/(x.end-x.when)))}:{i:0,frac:0}; };
  tick=setInterval(()=>{
    if(my!==glState.id) return;
    const now=ctx.currentTime;
    while(fired<starts.length && starts[fired].when<=now){
      quranAudioState.index=starts[fired].idx; if(hooks.onAyahStart) hooks.onAyahStart(queue[starts[fired].idx]); fired++; }
    if(allScheduled && starts.length && fired>=starts.length && now>=starts[starts.length-1].end){
      stopQuranAudio(); if(hooks.onQueueEnd) hooks.onQueueEnd(); }
  },40);
  (async()=>{
    await Promise.race([resolveReciter(quranReciter),new Promise(r=>setTimeout(r,4000))]);
    t=ctx.currentTime+0.2;
    for(let k=0;k<queue.length;k++){
      while(my===glState.id && starts.length-fired>=3) await new Promise(r=>setTimeout(r,150));
      if(my!==glState.id) return;
      if(k+1<queue.length) hzLoadBuf(ayahAudioUrl(queue[k+1])).catch(()=>{});
      let info; try{ info=await hzLoadBuf(ayahAudioUrl(queue[k])); }
      catch(e){ if(!starts.length){ onFail(); return; } if(++fails>=3){ stopQuranAudio(); alert(UI[lang].quranAudioError); return; } continue; }
      if(my!==glState.id) return;
      const src=ctx.createBufferSource(); src.buffer=info.buf; src.connect(ctx.destination);
      const when=Math.max(t,ctx.currentTime+0.03); src.start(when,info.off,info.dur); t=when+info.dur*(1+(hooks.gap||0))+(hooks.gap?0.5:0);
      starts.push({when,end:t,idx:k,src});
    }
    allScheduled=true;
  })();
}
function playGapless(queue,hooks){
  try{ hzGetCtx(); }catch(e){}
  stopQuranAudio();
  if(!glState) glState={els:[new Audio(),new Audio()],id:0,wa:null,prog:null};
  const my=++glState.id; glSpeed=hooks.gap?1:(hooks.speed||hzSpeed);
  glState.fullQueue=hooks._full||queue; glState.base=hooks._base||0; glState.hooks=hooks;
  quranAudioState.playing=true; quranAudioState.queue=queue; quranAudioState.index=0;
  glKeepStart();
  const C=window.AudioContext||window.webkitAudioContext;
  if(C && glSpeed===1) playGaplessWA(queue,hooks,my,()=>{ if(my!==glState.id) return; if(hooks.gap){ stopQuranAudio(); alert(UI[lang].quranAudioError); } else playGaplessEl(queue,hooks,my); });
  else playGaplessEl(queue,hooks,my);

// Variante par lecteurs audio (vitesse ≠ 1x, pour garder la voix naturelle) : démarre le verset suivant juste avant la fin.
function playGaplessEl(queue,hooks,my){
  const els=glState.els; let fails=0;
  const load=(i)=>{const e=els[i%2]; if(i>=queue.length) return e;
    if(e.dataset.i!==String(i)){e.dataset.i=String(i);e.src=ayahAudioUrl(queue[i]);e.preload='auto';e.load();}
    e.defaultPlaybackRate=glSpeed;e.playbackRate=glSpeed; return e;};
  const play=(i)=>{
    if(my!==glState.id) return;
    if(i>=queue.length){ stopQuranAudio(); if(hooks.onQueueEnd) hooks.onQueueEnd(); return; }
    const e=load(i); quranAudioState.index=i; let early=false;
    glState.prog=()=>({i,frac:(e.duration&&isFinite(e.duration))?Math.min(1,e.currentTime/e.duration):0});
    const go=()=>{ if(!early){ early=true; play(i+1); } };
    const watch=()=>{ if(my!==glState.id||early) return; const d=e.duration;
      if(d&&isFinite(d)&&d-e.currentTime<0.15*glSpeed) go(); else requestAnimationFrame(watch); };
    requestAnimationFrame(watch);
    e.onended=go;
    e.onerror=()=>{ if(++fails>=3){stopQuranAudio();alert(UI[lang].quranAudioError);} else play(i+1); };
    e.play().catch(()=>{});
    if(hooks.onAyahStart) hooks.onAyahStart(queue[i]);
    setTimeout(()=>{ if(my===glState.id) load(i+1); },250);
  };
  play(0);
}
