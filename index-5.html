<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahreç — points d'articulation</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1D4A35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mahreç">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Amiri:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC; --paper-2:#F2EBD9; --ink:#20291F; --ink-soft:#5B6459;
    --emerald:#2E6B4E; --emerald-deep:#1D4A35; --gold:#B0812B; --gold-soft:#E4CB93;
    --line:#DCD2B4; --risk:#9C4A32; --risk-soft:#F3E1D8; --card:#FFFFFF;
  }
  body.dark{
    --paper:#1B211C; --paper-2:#222A22; --ink:#EDE8D8; --ink-soft:#A9B0A2;
    --emerald:#4C9970; --emerald-deep:#8BD1A6; --gold:#D9AA4E; --gold-soft:#6B5A30;
    --line:#39412F; --risk:#D98B6E; --risk-soft:#3A2A22; --card:#232B24;
  }
  body{transition:background .2s ease, color .2s ease;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3', sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:860px;margin:0 auto;padding:48px 20px 90px;}

  header{display:flex;gap:28px;align-items:center;margin-bottom:8px;}
  .hero-text{flex:1;min-width:220px;}
  .kicker-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .kicker{font-size:14px;color:var(--gold);letter-spacing:.02em;}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;flex-shrink:0;}
  .lang-btn{
    font-family:'Source Sans 3', sans-serif;font-size:13px;font-weight:600;padding:6px 14px;
    background:var(--card);color:var(--ink-soft);border:none;cursor:pointer;
  }
  .lang-btn.active{background:var(--emerald);color:#fff;}
  .dark-toggle{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  h1{font-family:'Fraunces', serif;font-size:clamp(32px,6vw,48px);font-weight:500;margin:0 0 10px;line-height:1.05;}
  .sub{color:var(--ink-soft);font-size:15.5px;max-width:52ch;line-height:1.55;}
  .diagram-hero{width:150px;height:150px;flex-shrink:0;}

  .app-nav{
    display:flex;gap:8px;overflow-x:auto;margin-top:26px;padding-bottom:10px;
    border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .app-nav::-webkit-scrollbar{display:none;}
  .app-nav button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:9px 16px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;flex-shrink:0;
  }
  .app-nav button.active{background:var(--emerald);border-color:var(--emerald);color:#fff;}

  .page{display:none;}
  .page.active{display:block;}

  .progress-block{
    margin-top:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:16px 0;display:flex;align-items:center;gap:16px;
  }
  .progress-track{flex:1;height:8px;background:var(--paper-2);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;background:var(--emerald);width:0%;transition:width .4s ease;}
  .progress-label{font-size:14px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums;}

  .ref-links{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px;color:var(--ink-soft);}
  .ref-links a{color:var(--emerald-deep);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold-soft);}
  .ref-links a:hover{border-bottom-color:var(--emerald);}

  section.zone{margin-top:46px;}
  .zone-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px;}
  .zone-head h2{font-family:'Fraunces', serif;font-weight:500;font-size:22px;margin:0;}
  .zone-head .zone-ar{font-family:'Amiri', serif;color:var(--gold);font-size:22px;}
  .zone-count{margin-left:auto;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  .letters{display:flex;flex-direction:column;gap:10px;}
  .letter-card{border:1px solid var(--line);background:var(--card);border-radius:10px;overflow:hidden;}
  .letter-row{display:flex;align-items:center;gap:16px;padding:12px 16px;cursor:pointer;user-select:none;}
  .letter-ar-badge{font-family:'Amiri', serif;font-size:34px;line-height:1;width:48px;text-align:center;flex-shrink:0;color:var(--ink);}
  .letter-card.done .letter-ar-badge{color:var(--emerald-deep);}
  .letter-main{flex:1;min-width:0;}
  .letter-name{font-size:14.5px;font-weight:600;}
  .letter-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.35;}
  .check{
    width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:var(--card);
    transition:background .15s ease, border-color .15s ease;
  }
  .letter-card.done .check{background:var(--gold);border-color:var(--gold);}
  .letter-card.done .letter-name{color:var(--emerald-deep);}
  .caret{color:var(--ink-soft);font-size:12px;transition:transform .2s ease;flex-shrink:0;width:14px;text-align:center;}
  .letter-card.open .caret{transform:rotate(90deg);}

  .letter-detail{max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--paper-2);}
  .letter-card.open .letter-detail{max-height:640px;border-top:1px solid var(--line);}
  .letter-detail-inner{padding:20px 18px 22px;display:grid;grid-template-columns:150px 1fr;gap:20px;}
  .detail-visual{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .detail-visual svg{width:140px;height:140px;}
  .detail-big-ar{font-family:'Amiri', serif;font-size:48px;line-height:1;color:var(--emerald-deep);}
  .detail-zone-tag{font-size:11px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px;text-align:center;}
  .detail-img-link{font-size:12px;color:var(--emerald-deep);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold-soft);text-align:center;}
  .detail-img-link:hover{border-bottom-color:var(--emerald);}

  .detail-block{margin-bottom:12px;}
  .detail-block:last-child{margin-bottom:0;}
  .detail-block-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);font-weight:600;margin-bottom:3px;}
  .detail-block-text{font-size:13.5px;line-height:1.55;color:var(--ink);}
  .detail-block-text a{color:var(--emerald-deep);font-weight:600;}

  .letter-note-label{font-size:12px;color:var(--ink-soft);margin-bottom:4px;display:block;margin-top:14px;}
  .letter-note{
    width:100%;resize:vertical;min-height:44px;font-family:inherit;font-size:13.5px;
    padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);
  }
  .letter-note:focus{outline:none;border-color:var(--emerald);}

  @media (max-width:560px){
    .letter-detail-inner{grid-template-columns:1fr;}
    .detail-visual{flex-direction:row;justify-content:center;}
    header{flex-direction:column;align-items:flex-start;}
    .diagram-hero{order:-1;}
  }

  .tip{font-size:13.5px;color:var(--ink-soft);margin-top:14px;padding-left:14px;border-left:2px solid var(--gold);line-height:1.5;}

  .risk-section{margin-top:56px;}
  .risk-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:24px;margin:0 0 4px;}
  .risk-grid{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .risk-item{background:var(--risk-soft);border:1px solid #E3C3B2;border-radius:8px;padding:14px 16px;}
  .risk-pair{font-family:'Amiri', serif;font-size:24px;color:var(--risk);margin-bottom:4px;}
  .risk-desc{font-size:13.5px;color:var(--ink);line-height:1.5;}
  .risk-imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .risk-imgs a{font-size:12px;font-weight:600;color:var(--emerald-deep);text-decoration:none;border-bottom:1px solid var(--gold-soft);}

  .quiz-section, .sifat-section, .journal-section{margin-top:56px;}
  .quiz-section h2, .sifat-section h2, .journal-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:24px;margin:0 0 4px;}
  .quiz-box{
    margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:28px 20px;text-align:center;
  }
  .quiz-diff{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .quiz-diff button{
    font-family:'Source Sans 3', sans-serif;font-size:13px;font-weight:600;padding:7px 15px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;
  }
  .quiz-diff button.active.easy{background:#4C9970;border-color:#4C9970;color:#fff;}
  .quiz-diff button.active.medium{background:var(--gold);border-color:var(--gold);color:#fff;}
  .quiz-diff button.active.hard{background:var(--risk);border-color:var(--risk);color:#fff;}
  .quiz-score{margin-top:10px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .quiz-ar{font-family:'Amiri', serif;font-size:64px;color:var(--ink);margin-bottom:14px;}
  .quiz-display-text{font-family:'Fraunces', serif;font-size:19px;color:var(--emerald-deep);margin-bottom:14px;line-height:1.4;}
  .quiz-prompt{font-size:14px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
  .quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;text-align:left;max-width:480px;margin-left:auto;margin-right:auto;}
  .quiz-opt{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:11px 16px;
    border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
    text-align:left;line-height:1.4;
  }
  .quiz-opt.correct{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .quiz-opt.wrong{background:var(--risk);border-color:var(--risk);color:#fff;}
  .quiz-feedback{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-top:10px;max-width:52ch;margin-left:auto;margin-right:auto;}
  .quiz-next{
    margin-top:16px;font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;
    padding:8px 18px;border-radius:20px;border:1px solid var(--emerald);background:transparent;color:var(--emerald-deep);cursor:pointer;
  }

  .quiz-modes{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}

  .flash-progress{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;font-variant-numeric:tabular-nums;}
  .flash-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    min-height:180px;display:flex;align-items:center;justify-content:center;
    padding:26px 20px;text-align:center;cursor:pointer;
  }
  .flash-front{font-family:'Amiri', serif;font-size:56px;color:var(--ink);}
  .flash-back{display:none;font-size:14.5px;line-height:1.6;color:var(--ink);}
  .flash-card.revealed .flash-front{display:none;}
  .flash-card.revealed .flash-back{display:block;}
  .flash-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;}
  .flash-btn{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:10px 20px;
    border-radius:20px;border:none;cursor:pointer;
  }
  .flash-btn.reveal{background:var(--emerald);color:#fff;}
  .flash-btn.know{background:var(--emerald);color:#fff;}
  .flash-btn.review{background:var(--risk);color:#fff;}

  .tf-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 20px;text-align:center;}
  .tf-statement{font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:18px;}
  .tf-options{display:flex;gap:10px;justify-content:center;margin-bottom:12px;}
  .tf-opt{
    font-family:'Source Sans 3', sans-serif;font-size:14px;font-weight:700;padding:10px 26px;
    border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .tf-opt.correct{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .tf-opt.wrong{background:var(--risk);border-color:var(--risk);color:#fff;}

  .match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .match-card{
    aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:'Amiri', serif;font-size:22px;color:var(--ink);padding:6px;text-align:center;line-height:1.2;
  }
  .match-card.selected{border-color:var(--emerald);background:var(--paper-2);}
  .match-card.matched{background:var(--emerald);border-color:var(--emerald);color:#fff;opacity:0.6;}
  @media (max-width:480px){ .match-grid{grid-template-columns:repeat(3,1fr);} }

  .sifat-grid{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .sifat-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
  .sifat-name{font-family:'Fraunces', serif;font-size:16px;color:var(--emerald-deep);margin-bottom:4px;}
  .sifat-desc{font-size:13.5px;color:var(--ink);line-height:1.5;}

  .rules-section{margin-top:56px;}
  .rules-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:24px;margin:0 0 4px;}
  .rule-category{margin-top:26px;}
  .rule-category-title{
    font-family:'Fraunces', serif;font-size:17px;color:var(--gold);margin-bottom:10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .rule-grid{display:flex;flex-direction:column;gap:8px;}
  .rule-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 15px;}
  .rule-name{font-size:14px;font-weight:600;color:var(--emerald-deep);margin-bottom:3px;}
  .rule-desc{font-size:13px;color:var(--ink);line-height:1.5;}

  .journal-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
  .journal-form input[type="date"]{
    font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:var(--card);color:var(--ink);
  }
  .journal-form input[type="text"]{
    flex:1;min-width:180px;font-family:inherit;font-size:13.5px;padding:8px 10px;
    border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);
  }
  .journal-form button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:8px 18px;
    border-radius:6px;border:none;background:var(--emerald);color:#fff;cursor:pointer;
  }
  .journal-list{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .journal-item{
    display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;font-size:13.5px;align-items:baseline;
  }
  .journal-item .jd{font-weight:600;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .journal-item .jt{color:var(--ink);flex:1;}
  .journal-empty{font-size:13.5px;color:var(--ink-soft);margin-top:14px;}

  .export-row{margin-top:44px;text-align:center;}
  .export-row button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:10px 22px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  }

  .resources{margin-top:56px;}
  .resources h2{font-family:'Fraunces', serif;font-weight:500;font-size:26px;margin:0 0 4px;}
  .resources .sub{margin-bottom:20px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{
    font-family:'Source Sans 3', sans-serif;font-size:14px;font-weight:600;padding:8px 16px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;
  }
  .tab.active{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .res-group{display:none;flex-direction:column;gap:10px;}
  .res-group.active{display:flex;}
  .res-item{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);}
  .res-item:hover{border-color:var(--emerald);}
  .res-num{font-family:'Fraunces', serif;color:var(--gold);font-size:15px;flex-shrink:0;width:20px;}
  .res-title{font-size:15px;font-weight:600;margin-bottom:2px;line-height:1.3;}
  .res-note{font-size:13px;color:var(--ink-soft);line-height:1.4;}

  footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);}

  .progress-section h2, .tools-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:26px;margin:0 0 4px;}

  .streak-box{
    margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .streak-num{font-family:'Fraunces', serif;font-size:38px;color:var(--gold);line-height:1;}
  .streak-label{font-size:12.5px;color:var(--ink-soft);}
  .streak-sep{width:1px;height:34px;background:var(--line);}

  .badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:20px;}
  .badge-item{
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-align:center;
    opacity:0.4;
  }
  .badge-item.unlocked{opacity:1;border-color:var(--gold);}
  .badge-icon{font-size:26px;margin-bottom:6px;}
  .badge-name{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;}

  .graph-box{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;}
  .graph-title{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}

  .tool-block{margin-top:34px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 20px;}
  .tool-block h3{font-family:'Fraunces', serif;font-size:18px;font-weight:500;margin:0 0 12px;color:var(--emerald-deep);}
  .tool-note{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;}

  .metro-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .metro-controls select, .metro-controls button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:9px 14px;
    border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .metro-controls button.start{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .metro-display{text-align:center;padding:20px 0;}
  .metro-pulse{
    width:80px;height:80px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
    font-family:'Fraunces', serif;font-size:30px;color:var(--ink);transition:transform .1s ease, background .1s ease;
  }
  .metro-pulse.beat{transform:scale(1.12);background:var(--gold);border-color:var(--gold);color:#fff;}
  .metro-count-label{font-size:12.5px;color:var(--ink-soft);}

  .rec-controls{display:flex;gap:10px;flex-wrap:wrap;}
  .rec-controls button{
    font-family:'Source Sans 3', sans-serif;font-size:13.5px;font-weight:600;padding:10px 18px;
    border-radius:20px;border:none;cursor:pointer;
  }
  .rec-controls button.record{background:var(--risk);color:#fff;}
  .rec-controls button.stop{background:var(--ink);color:#fff;}
  #recPlayback{margin-top:14px;}
  #recPlayback audio{width:100%;}
  .rec-error{font-size:12.5px;color:var(--risk);margin-top:10px;}

  .tools-section, .stats-section{margin-top:8px;}
  .tools-section h2, .stats-section h2{font-family:'Fraunces', serif;font-weight:500;font-size:24px;margin:0 0 4px;}

  .metro-box{
    margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;

// Si l'app n'est pas ouverte dans Claude (donc window.storage n'existe pas),
// on utilise le stockage du navigateur (localStorage) à la place, de façon transparente.
if(!window.storage){
  window.storage = {
    async get(key){
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared:false };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value, shared:false };
    },
    async delete(key){
      localStorage.removeItem(key);
      return { key, deleted:true, shared:false };
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, shared:false };
    }
  };
}

async function persist(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ console.error('Save failed', e); }
}
function toggleDone(id){
  const entry = state[id] || {done:false, note:''};
  entry.done = !entry.done;
  state[id] = entry;
  renderLetters();
  persist();
}
function saveNote(id, value){
  const entry = state[id] || {done:false, note:''};
  entry.note = value;
  state[id] = entry;
  persist();
}
async function loadState(){
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value) state = JSON.parse(result.value);
  }catch(e){ state = {}; }
  renderLetters();
}

// ---- Quiz : moteur générique avec niveaux de difficulté ----
const FLAT_LETTERS = [];
Object.entries(LETTERS).forEach(([zone, arr])=>{
  arr.forEach((l, idx)=> FLAT_LETTERS.push({zone, idx, l}));
});
const FLAT_RULES = [];
RULES.forEach(cat=>{ cat.items.forEach(it=> FLAT_RULES.push({cat, it})); });

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function genZone(){
  const t = UI[lang];
  const item = pickRandom(FLAT_LETTERS);
  const zones = ['gorge','langue','levres'];
  const zoneLabels = {gorge:t.zoneGorge, langue:t.zoneLangue, levres:t.zoneLevres};
  const options = zones.map(z=>zoneLabels[z]);
  return {
    display: item.l.ar, displayIsText:false,
    prompt: t.quizGuess,
    options, correctIndex: zones.indexOf(item.zone),
    explanation: item.l[lang].tip
  };
}

function genLetterName(hard){
  const t = UI[lang];
  const item = pickRandom(FLAT_LETTERS);
  const correctName = item.l[lang].name;
  let pool = hard
    ? FLAT_LETTERS.filter(x => x.zone === item.zone && x.l[lang].name !== correctName)
    : FLAT_LETTERS.filter(x => x.l[lang].name !== correctName);
  if(pool.length < 3) pool = FLAT_LETTERS.filter(x => x.l[lang].name !== correctName);
  const distractors = shuffle(pool).slice(0,3).map(x => x.l[lang].name);
  const options = shuffle([correctName, ...distractors]);
  return {
    display: item.l.ar, displayIsText:false,
    prompt: t.qLetterName,
    options, correctIndex: options.indexOf(correctName),
    explanation: item.l[lang].desc + ' — ' + item.l[lang].tip
  };
}

function genSifatMatch(){
  const t = UI[lang];
  const item = pickRandom(SIFAT);
  const correctDesc = item[lang].desc;
  const pool = shuffle(SIFAT.filter(s => s !== item)).slice(0,3).map(s => s[lang].desc);
  const options = shuffle([correctDesc, ...pool]);
  return {
    display: item[lang].name, displayIsText:true,
    prompt: t.qSifat(item[lang].name),
    options, correctIndex: options.indexOf(correctDesc),
    explanation: correctDesc
  };
}

function genRuleName(){
  const t = UI[lang];
  const item = pickRandom(FLAT_RULES);
  const correctName = item.it[lang].name;
  const correctDesc = item.it[lang].desc;
  let pool = FLAT_RULES.filter(x => x.it[lang].name !== correctName);
  const distractors = shuffle(pool).slice(0,3).map(x => x.it[lang].name);
  const options = shuffle([correctName, ...distractors]);
  return {
    display: null, displayIsText:false,
    prompt: t.qRule(correctDesc),
    options, correctIndex: options.indexOf(correctName),
    explanation: item.cat[lang] + ' — ' + correctName
  };
}

function genRiskPair(){
  const t = UI[lang];
  const item = pickRandom(RISK_PAIRS);
  const correctDesc = item[lang];
  const pool = shuffle(RISK_PAIRS.filter(r => r !== item)).slice(0,3).map(r => r.pair);
  const options = shuffle([item.pair, ...pool]);
  return {
    display: null, displayIsText:false,
    prompt: correctDesc,
    promptIsQuestion:true,
    options, correctIndex: options.indexOf(item.pair),
    explanation: t.qRisk
  };
}

const QUESTION_POOLS = {
  easy: [ genZone, genZone, () => genLetterName(false) ],
  medium: [ () => genLetterName(false), genSifatMatch, genZone ],
  hard: [ () => genLetterName(true), genRuleName, genRiskPair, genSifatMatch ]
};

let matchCards = [];
let matchSelected = [];

function buildMatchRound(){
  const items = shuffle(FLAT_LETTERS).slice(0, 4);
  matchCards = [];
  items.forEach((it, i)=>{
    matchCards.push({ id:'ar'+i, pairId:i, value: it.l.ar, isAr:true, matched:false });
    matchCards.push({ id:'nm'+i, pairId:i, value: it.l[lang].name, isAr:false, matched:false });
  });
  matchCards = shuffle(matchCards);
  matchSelected = [];
}

function renderMatchMode(container){
  const t = UI[lang];
  if(matchCards.length === 0) buildMatchRound();
  const allMatched = matchCards.every(c=>c.matched);
  container.innerHTML = `
    <p class="sub" style="margin-bottom:14px;">${t.matchInstructions}</p>
    <div class="match-grid">
      ${matchCards.map(c => `
        <button class="match-card${c.matched ? ' matched' : ''}${matchSelected.includes(c.id) ? ' selected' : ''}"
                data-id="${c.id}" ${c.matched ? 'disabled' : ''}
                style="${c.isAr ? '' : 'font-family:\'Source Sans 3\',sans-serif;font-size:12px;font-weight:600;'}">${c.value}</button>
      `).join('')}
    </div>
    ${allMatched ? `<div style="text-align:center;"><button class="quiz-next" id="matchNewBtn">${t.matchNew}</button></div>` : ''}
  `;
  container.querySelectorAll('.match-card').forEach(btn=>{
    btn.addEventListener('click', ()=> handleMatchClick(btn.dataset.id, container));
  });
  if(allMatched){
    document.getElementById('matchNewBtn').addEventListener('click', ()=>{ matchCards = []; renderMatchMode(container); });
  }
}

function handleMatchClick(id, container){
  if(matchSelected.includes(id)) return;
  const card = matchCards.find(c => c.id === id);
  if(card.matched) return;
  matchSelected.push(id);
  if(matchSelected.length === 2){
    const [id1, id2] = matchSelected;
    const c1 = matchCards.find(c => c.id === id1);
    const c2 = matchCards.find(c => c.id === id2);
    if(c1.pairId === c2.pairId && c1.isAr !== c2.isAr){
      c1.matched = true; c2.matched = true;
      matchSelected = [];
      renderMatchMode(container);
      if(matchCards.every(c=>c.matched)){
        lifetimeStats.matchRounds = (lifetimeStats.matchRounds || 0) + 1;
        persistLifetimeStats();
        renderBadges();
      }
    } else {
      renderMatchMode(container);
      setTimeout(()=>{ matchSelected = []; renderMatchMode(container); }, 700);
    }
  } else {
    renderMatchMode(container);
  }
}

// ---- Métronome des madd ----
let metroInterval = null;
let metroBeat = 0;
let metroTotal = 4;
let audioCtx = null;

function beep(strong){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = strong ? 880 : 600;
  gain.gain.value = 0.15;
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
  osc.stop(audioCtx.currentTime + 0.13);
}

function renderMetroDots(){
  document.getElementById('metroDots').innerHTML = Array.from({length: metroTotal}).map((_, i) => `
    <span class="metro-dot${i === metroBeat ? ' active' : ''}"></span>
  `).join('');
  document.getElementById('metroCount').textContent = metroBeat + 1;
}

function renderMetroLengths(){

  document.getElementById('metroLengths').innerHTML = opts.map(n => `
    <button class="${n === metroTotal ? 'active' : ''}" data-len="${n}">${n}</button>
  `).join('');
  document.querySelectorAll('#metroLengths button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      metroTotal = parseInt(btn.dataset.len, 10);

      renderMetroLengths();

}

function toggleMetronome(){
  const t = UI[lang];
  const btn = document.getElementById('metroToggle');
  if(metroInterval){
    clearInterval(metroInterval);
    metroInterval = null;
    btn.textContent = t.metroStart;
    btn.classList.remove('stop');
  } else {
    metroBeat = -1;
    metroInterval = setInterval(()=>{
      metroBeat = (metroBeat + 1) % metroTotal;
      beep(metroBeat === 0);
      renderMetroDots();
    }, 700);
    btn.textContent = t.metroStop;
    btn.classList.add('stop');
  }
}

let surahList = null;

let trEditionCache = null;

async function getCachedQuran(key){
  try{
    const result = await window.storage.get(key, false);
    return result && result.value ? JSON.parse(result.value) : null;
  }catch(e){ return null; }
}
async function setCachedQuran(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); }catch(e){}
}

async function resolveTrEdition(){
  if(trEditionCache) return trEditionCache;
  try{
    const res = await fetch('https://api.alquran.cloud/v1/edition/language/tr');
    const data = await res.json();
    const editions = data.data || [];
    const translations = editions.filter(e => e.type === 'translation');
    const yazir = translations.find(e =>
      /yazir/i.test(e.identifier) ||
      /yaz[iı]r/i.test(e.name || '') ||
      /yaz[iı]r/i.test(e.englishName || '')
    );
    const pick = yazir || translations[0] || editions[0];
    trEditionCache = pick ? pick.identifier : 'tr.diyanet';
  }catch(e){
    trEditionCache = 'tr.diyanet';
  }
  return trEditionCache;
}

async function loadSurah(num){
  const t = UI[lang];
  const container = document.getElementById('quranContent');
  container.innerHTML = `<p class="sub">${t.quranLoading}</p>`;

  const arKey = `quran-ar-${num}`;

  try{
    if(!s){
      const arRes = await fetch(`https://api.alquran.cloud/v1/surah/${num}/quran-uthmani`);
      const arData = await arRes.json();
      s = arData.data;
      await setCachedQuran(arKey, s);

    let transAyahs = null;
    if(showTranslation){
      const transEdition = lang === 'fr' ? 'fr.hamidullah' : await resolveTrEdition();
      const trKey = `quran-tr-${lang}-${num}`;
      transAyahs = await getCachedQuran(trKey);
      if(!transAyahs){
        const trRes = await fetch(`https://api.alquran.cloud/v1/surah/${num}/${transEdition}`);
        const trData = await trRes.json();
        transAyahs = trData.data.ayahs;
        await setCachedQuran(trKey, transAyahs);
      }
    }

    container.innerHTML = `
      <button class="quiz-next" id="backToList">${t.quranBack}</button>
      ${fromCache ? `<p class="tool-note">${t.quranOffline}</p>` : ''}

        <div class="surah-header-en">${s.englishName} — ${s.englishNameTranslation}</div>

      <label class="surah-toggle"><input type="checkbox" id="transToggle" ${showTranslation ? 'checked' : ''}> ${t.quranShowTrans}</label>
      <div class="ayah-list">
        ${s.ayahs.map((a, i) => `
          <div class="ayah-item">
            <div class="ayah-num">${a.numberInSurah}</div>
            <div class="ayah-ar">${a.text}</div>
            ${transAyahs ? `<div class="ayah-tr">${transAyahs[i].text}</div>` : ''}
          </div>
        `).join('')}
      </div>
    `;
    document.getElementById('backToList').addEventListener('click', renderSurahList);
    document.getElementById('transToggle').addEventListener('change', (e)=>{

  }catch(e){

async function toggleRecording(){
  const t = UI[lang];
  if(isRecording){
    mediaRecorder.stop();
    isRecording = false;
    renderRecorder();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => recChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      document.getElementById('recPlayback').innerHTML = `<audio controls src="${url}"></audio>`;
      stream.getTracks().forEach(track => track.stop());
    };
    mediaRecorder.start();
    isRecording = true;
    renderRecorder();
  }catch(e){
    document.getElementById('recPlayback').innerHTML = `<div class="rec-error">${t.recDenied}</div>`;
  }
}

const STREAK_KEY = 'mahrec-streak-v1';
const HISTORY_KEY = 'mahrec-history-v1';
const STATS_KEY = 'mahrec-lifetime-stats-v1';
let streak = { current: 0, longest: 0, lastDate: null };
let history = [];
let lifetimeStats = { quizCorrect: 0, matchRounds: 0 };

function todayStr(){ return new Date().toISOString().slice(0, 10); }
function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

async function loadStreak(){
  try{
    const result = await window.storage.get(STREAK_KEY, false);
    if(result && result.value) streak = JSON.parse(result.value);
  }catch(e){ streak = { current:0, longest:0, lastDate:null }; }

  const today = todayStr();
  if(streak.lastDate !== today){
    const diff = streak.lastDate ? daysBetween(streak.lastDate, today) : null;
    if(diff === 1) streak.current += 1;
    else if(diff === null || diff > 1) streak.current = 1;
    // diff === 0 already excluded by the outer check
    streak.longest = Math.max(streak.longest || 0, streak.current);
    streak.lastDate = today;
    try{ await window.storage.set(STREAK_KEY, JSON.stringify(streak), false); }catch(e){}
  }
}

async function loadHistory(){
  try{
    const result = await window.storage.get(HISTORY_KEY, false);
    if(result && result.value) history = JSON.parse(result.value);
  }catch(e){ history = []; }
}

async function recordTodaySnapshot(){
  const total = Object.values(LETTERS).flat().filter((_, i) => true).length;
  let doneCount = 0;
  Object.values(state).forEach(e => { if(e && e.done) doneCount++; });
  const today = todayStr();
  const last = history[history.length - 1];
  if(last && last.date === today){
    last.count = doneCount;
  } else {
    history.push({ date: today, count: doneCount });
  }
  if(history.length > 60) history = history.slice(-60);
  try{ await window.storage.set(HISTORY_KEY, JSON.stringify(history), false); }catch(e){}
}

async function loadLifetimeStats(){
  try{
    const result = await window.storage.get(STATS_KEY, false);
    if(result && result.value) lifetimeStats = JSON.parse(result.value);
  }catch(e){ lifetimeStats = { quizCorrect:0, matchRounds:0 }; }
}
async function persistLifetimeStats(){

}

    return;
  }
  list.innerHTML = journal.map(e => `
    <div class="journal-item"><span class="jd">${e.date}</span><span class="jt">${e.text}</span></div>
  `).join('');
}

async function persistJournal(){
  try{ await window.storage.set(JOURNAL_KEY, JSON.stringify(journal), false); }
  catch(e){ console.error('Journal save failed', e); }
}
async function loadJournal(){
  try{
    const result = await window.storage.get(JOURNAL_KEY, false);
    if(result && result.value) journal = JSON.parse(result.value);
  }catch(e){ journal = []; }
  renderJournal();
}

document.getElementById('journalDate').valueAsDate = new Date();
document.getElementById('journalAddBtn').addEventListener('click', ()=>{
  const dateEl = document.getElementById('journalDate');
  const inputEl = document.getElementById('journalInput');
  if(!inputEl.value.trim()) return;
  journal.unshift({date: dateEl.value, text: inputEl.value.trim()});
  inputEl.value = '';
  renderJournal();
  persistJournal();
});

// ---- Export ----
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const data = { progression: state, journal: journal, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mahrec-donnees.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ---- Dark mode ----
document.getElementById('darkToggle').addEventListener('click', ()=>{
  document.body.classList.toggle('dark');
  document.getElementById('darkToggle').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t2=>t2.classList.remove('active'));
    document.querySelectorAll('.res-group').forEach(g=>g.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('res-' + tab.dataset.tab).classList.add('active');
  });
});

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    lang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    applyStaticText();
    renderLetters();
    renderRisks();
    renderSifat();
    renderRules();
    matchCards = [];
    tfCurrent = null;
    renderQuizModes();
    renderQuizMode();
    renderJournal();
    renderNav();
    if(currentPage === 'tools') renderTools();
    if(currentPage === 'stats') renderStatsPage();
  });
});

applyStaticText();
renderResources();
renderRisks();
renderSifat();
renderRules();
renderQuizModes();
renderQuizMode();
loadJournal();
loadLifetimeStats();
(async () => {
  await loadHistory();
  await loadState();
  await recordTodaySnapshot();
  await loadStreak();
  renderStatsPage();
})();
renderNav();
showPage('letters');

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
